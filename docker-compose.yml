services:
  postgres:
    image: postgres:16-alpine
    container_name: odysseus-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: odysseus_dev
    ports:
      - "5432:5432"
    volumes:
      - odysseus_pgdata:/var/lib/postgresql/data

volumes:
  odysseus_pgdata:
