function fieldSuggestions(key, typed, exceptItemId) {
  const counts = new Map();
  for (const blk of state.blocks) if (blk.type === 'materials') for (const i of blk.items) {
    const value = String(i.values[key] ?? '').trim();
    if (value && i.id !== exceptItemId) counts.set(value, (counts.get(value) ?? 0) + 1);
  }
  const query = typed.trim().toLowerCase();
  const pool = [...new Set([...[...counts].sort((x, y) => y[1] - x[1]).map(([value]) => value), ...(FIELD_SUGGESTION_LISTS[key] ?? [])])].filter(v => v.toLowerCase() !== query);
  const starts = pool.filter(v => v.toLowerCase().startsWith(query));
  return [...starts, ...pool.filter(v => !starts.includes(v) && v.toLowerCase().includes(query))].slice(0, 8);
}

function drawSuggestions() {
  suggestList.innerHTML = suggestState.options.map((option, i) => `<div class="${i === suggestState.at ? 'on' : ''}" data-i="${i}">${esc(option)}</div>`).join('');
}

function showSuggestions(input) {
  const isText = input.matches('input.mfield') && input.type === 'text' && !input.classList.contains('mono');
  const options = isText && input.value.trim().length >= 2 ? fieldSuggestions(input.dataset.key, input.value, input.closest('[data-item]')?.dataset.item) : [];
  if (!options.length) { hideSuggestions(); return; }
  suggestState = { input, options, at: -1 };
  placeSuggestions();
  drawSuggestions();
  suggestList.hidden = false;
}

function placeSuggestions() {
  if (!suggestState) return;
  if (!suggestState.input.isConnected) { hideSuggestions(); return; }
  const r = suggestState.input.getBoundingClientRect();
  const frame = suggestState.input.closest('.blk-body').getBoundingClientRect();
  if (r.top < frame.top || r.bottom > frame.bottom) { hideSuggestions(); return; }
  Object.assign(suggestList.style, { left: `${r.left}px`, top: `${r.bottom + 4}px`, minWidth: `${Math.max(r.width, 180)}px` });
}

function hideSuggestions() {
  suggestState = null;
  suggestList.hidden = true;
}

function acceptSuggestion(i) {
  const { input, options } = suggestState;
  input.value = options[i];
  input.dispatchEvent(new Event('input', { bubbles: true }));
  hideSuggestions();
}

suggestList.addEventListener('mousedown', e => {
  e.preventDefault();
  const row = e.target.closest('[data-i]');
  if (row && suggestState) acceptSuggestion(+row.dataset.i);
});
suggestList.addEventListener('mouseover', e => {
  const row = e.target.closest('[data-i]');
  if (!row || !suggestState) return;
  suggestState.at = +row.dataset.i;
  drawSuggestions();
});
window.addEventListener('scroll', placeSuggestions, true);

function fillDown(b, td) {
  const row = td.closest('tr');
  const key = td.dataset.cell;
  const item = b.items.find(i => i.id === row.dataset.item);
  const source = b.items.find(i => i.id === row.previousElementSibling?.dataset.item);
  if (!source || key === 'name') return;
  if (key === 'type') setMaterialKind(b, item, source.group, source.type);
  else {
    const own = materialFields(b, item).find(x => x.key === key);
    const f = own ?? materialFields(b, source).find(x => x.key === key);
    if (!f) return;
    if (!own) item.custom.push({ ...f });
    if (isRun()) state.run.overrides[`${item.id}:${key}`] = effectiveValue({ id: `${source.id}:${key}`, value: source.values[key] ?? '', perRun: f.scope !== 'protocol' });
    else {
      item.values[key] = source.values[key] ?? '';
      if (source.units?.[key]) item.units[key] = source.units[key];
    }
    if (!item.on.includes(key)) item.on.push(key);
  }
  editCell(b, item.id, key);
  save();
  refresh();
}

const rememberKind = (name, group, type) => { if (name.trim()) state.guessMemory[normKey(name)] = { group, type }; };

function applyKind(b, item, group, type) {
  Object.assign(item, { group, type });
  const keys = new Set(materialFields(b, item).map(f => f.key));
  item.on = [...new Set([...item.on, ...materialDefaultFields(group, type)])].filter(k => keys.has(k));
}

function setMaterialKind(b, item, group, type) {
  applyKind(b, item, group, type);
  rememberKind(item.name, group, type);
}

const findDuplicate = (b, item) => (state.keptBoth.includes(normKey(item.name)) ? null : b.items.find(i => i !== item && normKey(i.name) === normKey(item.name)));

function mergeInto(b, target, source) {
  const targetFields = materialFields(b, target);
  for (const f of materialFields(b, source)) {
    const value = String(source.values[f.key] ?? '').trim();
    if (!value || String(target.values[f.key] ?? '').trim()) continue;
    if (!targetFields.some(x => x.key === f.key)) target.custom.push({ ...f });
    target.values[f.key] = source.values[f.key];
    if (source.units[f.key]) target.units[f.key] = source.units[f.key];
    if (!target.on.includes(f.key)) target.on.push(f.key);
  }
}

const reviewRow = (b, item, why) => ({ item, why, duplicate: findDuplicate(b, item), keepBoth: false });

function commitMaterials(b, rows) {
  const fresh = new Set();
  for (const { item, duplicate, keepBoth } of rows) {
    if (duplicate && !keepBoth) {
      mergeInto(b, duplicate, item);
      fresh.add(duplicate.id);
      continue;
    }
    if (duplicate) state.keptBoth.push(normKey(item.name));
    b.items.push(item);
    fresh.add(item.id);
    b.folded = b.folded.filter(g => g !== item.group);
  }
  freshMaterials.set(b.id, fresh);
  pendingDuplicates.delete(b.id);
  renderBlock(b);
  bodyOf(b).querySelector('.madd-name')?.focus();
  save();
  refresh();
}

function stepLabels() {
  const numbers = stepNumbers();
  let parent = '';
  return Object.fromEntries(state.steps.filter(s => s.kind === 'step').map(s => {
    const own = numbers[s.id].replace('.', '');
    if (s.level !== 2) parent = own;
    return [s.id, s.level === 2 ? `${parent}${own}` : own];
  }));
}

function materialUsage(b) {
  const ids = new Set(b.items.map(i => i.id));
  const owner = new Map();
  for (const [key, entry] of calc.names) {
    const id = String(entry.id ?? '').split(':')[0];
    if (ids.has(id)) owner.set(key, id);
  }
  const usage = new Map(b.items.map(i => [i.id, { steps: [], formulas: 0 }]));
  const labels = stepLabels();
  for (const step of state.steps.filter(x => x.kind === 'step')) {
    for (const [, ref] of String(step.text).matchAll(/\{([^}]+)\}/g)) {
      const use = usage.get(owner.get(ref.trim().toLowerCase()));
      if (use && !use.steps.includes(labels[step.id])) use.steps.push(labels[step.id]);
    }
  }
  const names = [...calc.names.values()].map(e => e.name);
  for (const blk of state.blocks.filter(x => x.type === 'formula')) {
    for (const formula of blk.items) {
      const used = new Set(tokenize(String(formula.expr ?? ''), names).filter(t => t.t === 'name').map(t => owner.get(t.v.toLowerCase())).filter(Boolean));
      used.forEach(id => { usage.get(id).formulas += 1; });
    }
  }
  return usage;
}

function usageText({ steps, formulas }) {
  const parts = [];
  if (steps.length) parts.push(`${steps.length === 1 ? 'Step' : 'Steps'} ${steps.join(', ')}`);
  if (formulas) parts.push(`${formulas} formula${formulas === 1 ? '' : 's'}`);
  return parts.length ? esc(parts.join(' · ')) : '<span class="munused">Not used</span>';
}

function conjugateClashes(items) {
  const sharing = new Map();
  for (const item of items) {
    const raw = String(item.values.conjugate ?? '').trim();
    if (!raw || item.type === 'Isotype control' || guessIndex.conjugates.has(normKey(raw))) continue;
    const color = guessIndex.fluors.get(normKey(raw))?.name ?? raw;
    const panel = String(item.values.panel ?? '').trim();
    const key = `${normKey(panel)}|${normKey(color)}`;
    if (!sharing.has(key)) sharing.set(key, { color, panel, items: [] });
    sharing.get(key).items.push(item);
  }
  return [...sharing.values()].filter(c => c.items.length > 1);
}

const clashNote = ({ color, panel, items }) => `<div class="mclash">${panel ? `${esc(panel)}: ` : ''}${esc(color)} is on ${esc(listWords(items.map(i => i.name)))}.${panel ? '' : ' If they are stained in separate tubes, give them different panels.'}</div>`;

function storageRank(label) {
  const text = label.toLowerCase();
  if (!text) return Infinity;
  if (/ln2|liquid nitrogen|vapou?r phase/.test(text)) return -196;
  const degrees = text.match(/[-−–]?\s*\d+/);
  if (degrees) return parseFloat(degrees[0].replace(/[−–]/, '-').replace(/\s/g, ''));
  if (/\b(rt|room|ambient)\b/.test(text)) return 22;
  return 100;
}

function pullList(b) {
  const pulled = state.run.pulled ?? {};
  const places = new Map();
  for (const item of b.items.filter(i => i.name.trim() && !PULL_SKIP_GROUPS.has(i.group))) {
    const label = String(item.values.storage ?? '').trim();
    const key = label.toLowerCase();
    if (!places.has(key)) places.set(key, { label: label || 'Storage not set', rank: storageRank(label), items: [] });
    places.get(key).items.push(item);
  }
  return [...places.values()].sort((x, y) => x.rank - y.rank || x.label.localeCompare(y.label)).map(place => {
    const done = place.items.filter(i => pulled[i.id]).length;
    const rows = place.items.map(item => {
      const lot = String(effectiveValue({ id: `${item.id}:lot`, value: '', perRun: true })).trim();
      return `<div class="prow${pulled[item.id] ? ' done' : ''}" data-act="pull" data-item="${item.id}"><span class="chk">${pulled[item.id] ? '✓' : ''}</span><span class="pname">${esc(item.name)}</span>${lot ? `<span class="pmeta">lot ${esc(lot)}</span>` : ''}</div>`;
    }).join('');
    return `<section class="msec"><div class="msec-head plain"><span class="msec-title">${esc(place.label)}</span><span class="msec-count">${done}/${place.items.length}</span><span class="msec-line"></span></div><div class="plist">${rows}</div></section>`;
  }).join('');
}

function kindSelect(b, group, type, cls) {
  const options = g => (g.key === 'unsorted' ? ['Other'] : [...Object.keys(g.types), 'Other']).map(t => `<option value="${esc(g.key)}|${esc(t)}"${g.key === group && t === type ? ' selected' : ''}>${esc(g.key === 'unsorted' ? 'Unsorted' : t === 'Other' ? `Other ${g.label.toLowerCase()}` : t)}</option>`).join('');
  return `<select class="in mkind ${cls}">${materialGroupsOf(b).map(g => `<optgroup label="${esc(g.label)}">${options(g)}</optgroup>`).join('')}<option value="__new">New group…</option></select>`;
}

function guessLine(b, text) {
  if (!text.trim()) return '<span class="mg-why">Anything works: CD4 BV421, HeLa, DMEM + 10% FBS, 96-well plate, FlowJo 10.9. Paste a list to add many.</span>';
  const guess = guessMaterial(text, rememberedKinds());
  const item = materialFromGuess(b, guess);
  const filled = materialFields(b, item).filter(f => item.on.includes(f.key) && String(item.values[f.key] ?? '').trim());
  const where = guess.group === 'unsorted' ? 'Unsorted' : `${materialGroup(b, guess.group).label} › ${guess.type}`;
  const renamed = guess.name !== text.trim() ? `<span class="mg-f">name <b>${esc(guess.name)}</b></span>` : '';
  const duplicate = findDuplicate(b, item);
  const listed = duplicate ? `<span class="mg-dupe">${esc(duplicate.name)} is already listed</span>` : '';
  return `${listed}<span class="mg-where${guess.group === 'unsorted' ? ' none' : ''}">${esc(where)}</span>${renamed}${filled.map(f => `<span class="mg-f">${esc(f.label.toLowerCase())} <b>${esc(materialText(item, f))}</b></span>`).join('')}<span class="mg-why">${esc(guess.why)}</span><span class="mg-key">Enter to add</span>`;
}

function pasteReview(b, { rows, source }) {
  const note = row => (row.duplicate
    ? `<span class="mg-dupe">Already listed: ${row.keepBoth ? 'keeping both' : 'will merge'}</span><button class="lnk" data-act="paste-keep">${row.keepBoth ? 'Merge' : 'Keep both'}</button>`
    : esc(row.why));
  const lines = rows.map((row, i) => `<tr class="mprow${i % 2 ? ' alt' : ''}" data-row="${i}"><td class="mname">${esc(row.item.name)}</td><td>${kindSelect(b, row.item.group, row.item.type, 'mp-kind')}</td><td class="mg-why">${note(row)}</td><td class="mp-x"><button class="lnk" data-act="paste-drop" title="Leave this one out">×</button></td></tr>`).join('');
  const added = rows.filter(row => !row.duplicate || row.keepBoth).length;
  const merged = rows.length - added;
  const count = n => `${n} material${n === 1 ? '' : 's'}`;
  const action = [added ? `Add ${count(added)}` : '', merged ? `merge ${merged}` : ''].filter(Boolean).join(', ');
  return `<div class="mpaste"><div class="mpaste-head">${count(rows.length)} from ${esc(source)}. Check them, then add.</div><table class="mpaste-tab"><tbody>${lines}</tbody></table><div class="mpaste-tools"><button class="add primary" data-act="paste-add"><span class="plus">+</span>${action.charAt(0).toUpperCase()}${action.slice(1)}</button><button class="lnk" data-act="paste-cancel">Cancel</button></div></div>`;
}

function duplicatePrompt(b) {
  const { duplicate } = pendingDuplicates.get(b.id);
  return `<span class="mg-dupe">${esc(duplicate.name)} is already listed.</span><button class="lnk" data-act="dupe-merge">Merge</button><button class="lnk" data-act="dupe-keep">Keep both</button><span class="mg-why">Merge fills its blank fields from what you typed.</span>`;
}

function materialControl(item, f) {
  const run = isRun();
  const perRun = f.scope !== 'protocol';
  const value = run ? effectiveValue({ id: `${item.id}:${f.key}`, value: item.values[f.key] ?? '', perRun }) : item.values[f.key] ?? '';
  const cls = `in mfield${f.kind === 'number' ? ' mono' : ''}`;
  const control = f.kind === 'choice'
    ? `<select class="${cls}" data-key="${f.key}">${['', ...f.options].map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
    : `<input class="${cls}" data-key="${f.key}"${f.kind === 'date' ? ' type="date"' : ''} value="${esc(value)}" spellcheck="false" />`;
  if (f.kind !== 'number') return control;
  const unit = fieldUnit(item, f);
  const unitControl = f.unit === '*' && !run
    ? `<select class="in munit" data-unitkey="${f.key}">${(f.units ?? VALUE_UNITS).map(u => `<option value="${esc(u)}"${u === unit ? ' selected' : ''}>${esc(u || 'none')}</option>`).join('')}</select>`
    : `<span class="unit">${esc(shortUnit(unit))}</span>`;
  return `<span class="ramt">${unit === '1:N' ? '<span class="pre">1:</span>' : ''}${control}${unitControl}</span>`;
}

function materialText(item, f) {
  const perRun = f.scope !== 'protocol';
  const raw = isRun() ? effectiveValue({ id: `${item.id}:${f.key}`, value: item.values[f.key] ?? '', perRun }) : item.values[f.key] ?? '';
  return String(raw).trim() ? displayOf({ unit: f.kind === 'number' ? fieldUnit(item, f) : '' }, raw) : '';
}

function materialCell(item, f) {
  return isRun() && f.scope !== 'protocol' ? materialControl(item, f) : esc(materialText(item, f));
}

function materialSection(b, items, groupKey) {
  const run = isRun();
  const clashes = groupKey === 'ab' ? conjugateClashes(items) : [];
  const clashing = new Set(clashes.flatMap(c => c.items.map(i => i.id)));
  const columns = [];
  for (const item of items) for (const f of materialFields(b, item)) if (item.on.includes(f.key) && !columns.some(c => c.key === f.key)) columns.push(f);
  const editing = editingCells.get(b.id);
  const fresh = freshMaterials.get(b.id);
  const cell = (item, key, editable, show, edit, extraClass = '') => {
    const isEditing = editable && editing?.item === item.id && editing.key === key;
    return `<td class="${extraClass}mcell${editable ? ' editable' : ''}${isEditing ? ' editing' : ''}"${editable ? ` data-cell="${esc(key)}"` : ''}>${isEditing ? edit() : show()}</td>`;
  };
  const rows = items.map((item, i) => {
    const fields = materialFields(b, item);
    const name = cell(item, 'name', !run, () => esc(item.name) || '<span class="hint">Unnamed</span>', () => `<input class="in lname" value="${esc(item.name)}" placeholder="Name" spellcheck="false" />`, 'mname ');
    const kind = cell(item, 'type', !run, () => (item.group === 'unsorted' ? '<span class="mpending">choose</span>' : esc(item.type)), () => kindSelect(b, item.group, item.type, 'me-kind'), 'mtype ');
    const values = columns.map(c => {
      const f = fields.find(x => x.key === c.key) ?? c;
      const shown = item.on.includes(f.key);
      const editable = !run || (f.scope === 'protocol' && shown);
      const flag = f.key === 'conjugate' && clashing.has(item.id) ? 'clash ' : '';
      return cell(item, f.key, editable, () => (shown ? materialCell(item, f) : ''), () => materialControl(item, f), flag);
    }).join('');
    const used = run ? '' : '<td class="mused"></td>';
    const remove = run ? '' : '<td class="mrm"><button class="ghost-danger" data-act="del">Remove</button></td>';
    return `<tr class="mrow${i % 2 ? ' alt' : ''}${fresh?.has(item.id) ? ' fresh' : ''}" data-item="${item.id}" data-pick="${esc(item.name)}">${name}${kind}${values}${used}${remove}</tr>`;
  }).join('');
  const hideButton = c => (run ? '' : `<button class="mcol-x" data-act="hide-col" data-key="${esc(c.key)}" title="Hide this column">×</button>`);
  const moreHead = run ? '' : `<th class="mmore"><button class="lnk mmore-btn${fieldMenus.get(b.id) === groupKey ? ' on' : ''}" data-act="field-menu">+ Field</button></th>`;
  const table = `<div class="mtable-wrap"><table class="mtab"><thead><tr><th>Name</th><th>Type</th>${columns.map(c => `<th>${esc(c.label)}${hideButton(c)}</th>`).join('')}${run ? '' : '<th>Used in</th>'}${moreHead}</tr></thead><tbody>${rows}</tbody></table></div>`;
  return clashes.map(clashNote).join('') + (fieldMenus.get(b.id) === groupKey && !run ? fieldMenu(b, items, columns) : '') + table;
}

function fieldMenu(b, items, columns) {
  const counts = new Map();
  for (const item of items) for (const f of materialFields(b, item)) {
    if (columns.some(c => c.key === f.key)) continue;
    const seen = counts.get(f.key) ?? { f, n: 0, core: materialGroup(b, item.group).core.includes(f) };
    seen.n += 1;
    counts.set(f.key, seen);
  }
  const extras = [...counts.values()].sort((x, y) => x.core - y.core || y.n - x.n).map(({ f }) => `<button class="fchip" data-act="field-on" data-key="${esc(f.key)}">${esc(f.label)}</button>`).join('');
  return `<div class="mfields"><span class="mfields-l">More fields</span>${extras}<button class="fchip custom" data-act="field-custom">Your own field</button><button class="lnk" data-act="field-menu">Done</button></div>`;
}

function editCell(b, itemId, key) {
  hideSuggestions();
  editingCells.set(b.id, { item: itemId, key });
  renderBlock(b);
  const control = bodyOf(b).querySelector('td.editing .in');
  control?.focus();
  if (control?.select && control.type !== 'date') control.select();
}

function stopEditing(b) {
  hideSuggestions();
  if (!editingCells.delete(b.id)) return;
  renderBlock(b);
  save();
  refresh();
}

function moveEditing(b, td, step) {
  const cells = [...bodyOf(b).querySelectorAll('td.mcell.editable')];
  const next = cells[cells.indexOf(td) + step];
  if (!next) { stopEditing(b); return; }
  editCell(b, next.closest('[data-item]').dataset.item, next.dataset.cell);
  save();
  refresh();
}

function rememberLotValue(item, key, value) {
  const lot = String(state.run.overrides[`${item.id}:lot`] ?? '').trim();
  if (lot) ((state.lotMemory[item.id] ??= {})[lot] ??= {})[key] = value;
}

function fillFromLotMemory(item) {
  const lot = String(state.run.overrides[`${item.id}:lot`] ?? '').trim();
  const remembered = state.lotMemory[item.id]?.[lot];
  if (!remembered) return false;
  let filled = false;
  for (const [key, value] of Object.entries(remembered)) {
    const id = `${item.id}:${key}`;
    if (String(state.run.overrides[id] ?? '').trim()) continue;
    state.run.overrides[id] = value;
    if (!item.on.includes(key)) item.on.push(key);
    filled = true;
  }
  return filled;
}

const TYPES = {
  materials: {
    label: 'Materials', glyph: '⚗', hint: 'Everything the experiment uses, grouped', size: [12, 10],
    make: () => ({ title: 'Materials', folded: [], customGroups: [], items: [] }),
    render(b, body) {
      const run = isRun();
      const groups = materialGroupsOf(b);
      const pasted = materialPastes.get(b.id);
      exampleTitles ??= Object.entries(EXAMPLES).map(([key, make]) => [key, make().title]);
      const copyFrom = `<select class="in mcopy"><option value="">Copy from a protocol…</option>${exampleTitles.map(([key, title]) => `<option value="${key}">${esc(title)}</option>`).join('')}</select>`;
      const guess = pendingDuplicates.has(b.id) ? duplicatePrompt(b) : guessLine(b, '');
      const adder = `<div class="madd"><div class="madd-row"><input class="in madd-name" placeholder="Add a material: type a name and press Enter, or paste a list" spellcheck="false" autocomplete="off" />${copyFrom}</div><div class="mguess">${guess}</div>${pasted ? pasteReview(b, pasted) : ''}</div>`;
      const view = materialViews.get(b.id) ?? 'table';
      const viewSwitch = `<div class="mview"><button class="lnk${view === 'table' ? ' on' : ''}" data-act="view" data-view="table">Table</button><button class="lnk${view === 'pull' ? ' on' : ''}" data-act="view" data-view="pull">Pull list</button></div>`;
      if (run && view === 'pull') {
        body.innerHTML = viewSwitch + pullList(b);
        return;
      }
      const sections = groups.map(g => ({ g, items: b.items.filter(i => i.group === g.key) })).filter(s => s.items.length).sort((x, y) => (y.g.key === 'unsorted') - (x.g.key === 'unsorted'));
      body.innerHTML = (run ? viewSwitch : adder) + (sections.length ? sections.map(({ g, items }) => {
        const folded = b.folded.includes(g.key);
        return `<section class="msec${folded ? ' folded' : ''}" data-group="${esc(g.key)}"><div class="msec-head" data-act="fold-group"><span class="arrow">${folded ? '▸' : '▾'}</span><span class="msec-title">${esc(g.label)}</span><span class="msec-count">${items.length}</span><span class="msec-line"></span></div>${folded ? '' : `<div class="msec-body">${materialSection(b, items, g.key)}</div>`}</section>`;
      }).join('') : '<p class="hint">Nothing yet. Type a material above; a name is enough.</p>');
      freshMaterials.delete(b.id);
    },
    update(b, body) {
      const run = isRun();
      const usage = run ? null : materialUsage(b);
      body.querySelectorAll('tr.mrow[data-item]').forEach(el => {
        const item = b.items.find(i => i.id === el.dataset.item);
        if (!item) return;
        if (usage) el.querySelector('.mused').innerHTML = usageText(usage.get(item.id));
        el.querySelector('.lname')?.classList.toggle('bad', calc.dupes.has(item.id));
        if (!run) return;
        const fields = materialFields(b, item);
        el.querySelectorAll('.mfield').forEach(input => {
          const f = fields.find(x => x.key === input.dataset.key);
          const id = `${item.id}:${f.key}`;
          const changed = f.scope === 'protocol' && id in state.run.overrides;
          input.classList.toggle('changed', changed);
          input.classList.toggle('need', f.scope !== 'protocol' && !String(input.value).trim());
          input.classList.toggle('expired', f.kind === 'date' && !!f.warnPast && !!input.value && input.value < TODAY_ISO);
          input.title = changed ? `Protocol says ${item.values[f.key] || 'nothing'}` : '';
        });
      });
    },
    onInput(b, e) {
      const el = e.target;
      if (el.matches('.madd-name')) {
        pendingDuplicates.delete(b.id);
        bodyOf(b).querySelector('.mguess').innerHTML = guessLine(b, el.value);
        return;
      }
      const item = b.items.find(i => i.id === el.closest('[data-item]')?.dataset.item);
      if (!item) return;
      if (el.matches('.lname')) item.name = el.value;
      else if (el.dataset.unitkey) item.units[el.dataset.unitkey] = el.value;
      else if (el.matches('.mfield')) {
        const own = materialFields(b, item).find(x => x.key === el.dataset.key);
        const f = own ?? b.items.flatMap(i => materialFields(b, i)).find(x => x.key === el.dataset.key);
        if (!own && el.value.trim()) item.custom.push({ ...f });
        const id = `${item.id}:${f.key}`;
        if (!isRun()) {
          item.values[f.key] = el.value;
          if (el.value.trim() && !item.on.includes(f.key)) item.on.push(f.key);
          if (f.key === 'recipe') showMadeHereFields(item);
        } else if (f.scope === 'protocol' && el.value === (item.values[f.key] ?? '')) delete state.run.overrides[id];
        else state.run.overrides[id] = el.value;
        if (isRun() && f.scope === 'lot') rememberLotValue(item, f.key, el.value);
        bodyOf(b).querySelectorAll(`[data-item="${item.id}"] .mfield[data-key="${f.key}"]`).forEach(twin => { if (twin !== el) twin.value = el.value; });
      } else return;
      save();
      refresh();
      if (el.matches('.mfield') && el.isConnected) showSuggestions(el);
    },
    onChange(b, e) {
      const el = e.target;
      if (el.matches('.mcopy')) {
        const source = EXAMPLES[el.value]?.();
        if (!source) return;
        const items = source.blocks.filter(x => x.type === 'materials').flatMap(x => x.items);
        materialPastes.set(b.id, { source: source.title, rows: items.map(item => reviewRow(b, item, '')) });
        renderBlock(b);
        return;
      }
      if (el.matches('.mkind')) {
        let [group, type] = el.value.split('|');
        if (el.value === '__new') {
          const label = prompt('Name of the new group')?.trim();
          if (label && !materialGroupsOf(b).some(g => g.label.toLowerCase() === label.toLowerCase())) b.customGroups.push(label);
          group = materialGroupsOf(b).find(g => g.label.toLowerCase() === (label ?? '').toLowerCase())?.key;
          type = 'Other';
        }
        if (group && el.matches('.mp-kind')) {
          const row = materialPastes.get(b.id).rows[+el.closest('[data-row]').dataset.row];
          applyKind(b, row.item, group, type);
          Object.assign(row, { why: 'set by you', corrected: true });
        } else if (group) {
          setMaterialKind(b, b.items.find(i => i.id === el.closest('[data-item]').dataset.item), group, type);
        }
        editingCells.delete(b.id);
        renderBlock(b);
        save();
        refresh();
        return;
      }
      const item = b.items.find(i => i.id === el.closest('[data-item]')?.dataset.item);
      if (!item) return;
      if (el.dataset.unitkey || (isRun() && el.dataset.key === 'lot' && fillFromLotMemory(item))) {
        renderBlock(b);
        save();
        refresh();
      }
    },
    onClick(b, e) {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act) return;
      const item = b.items.find(i => i.id === e.target.closest('[data-item]')?.dataset.item);
      const key = e.target.closest('[data-key]')?.dataset.key;
      const pasted = materialPastes.get(b.id);
      const pastedRow = pasted?.rows[+e.target.closest('[data-row]')?.dataset.row];
      const pending = pendingDuplicates.get(b.id);
      if (act === 'paste-add' && pasted) {
        pasted.rows.filter(row => row.corrected).forEach(row => rememberKind(row.item.name, row.item.group, row.item.type));
        materialPastes.delete(b.id);
        commitMaterials(b, pasted.rows);
        return;
      }
      if ((act === 'dupe-merge' || act === 'dupe-keep') && pending) {
        commitMaterials(b, [{ ...pending, keepBoth: act === 'dupe-keep' }]);
        return;
      }
      if (act === 'pull' && item) {
        state.run.pulled ??= {};
        if (state.run.pulled[item.id]) delete state.run.pulled[item.id];
        else state.run.pulled[item.id] = true;
      } else if (act === 'view') materialViews.set(b.id, e.target.closest('[data-view]').dataset.view);
      else if (act === 'paste-cancel') materialPastes.delete(b.id);
      else if (act === 'paste-keep' && pastedRow) pastedRow.keepBoth = !pastedRow.keepBoth;
      else if (act === 'paste-drop' && pastedRow) {
        pasted.rows.splice(pasted.rows.indexOf(pastedRow), 1);
        if (!pasted.rows.length) materialPastes.delete(b.id);
      } else if (act === 'fold-group') {
        const group = e.target.closest('[data-group]').dataset.group;
        b.folded = b.folded.includes(group) ? b.folded.filter(g => g !== group) : [...b.folded, group];
      } else if (act === 'del' && item && confirm(`Remove ${item.name || 'this material'}?`)) {
        b.items = b.items.filter(i => i !== item);
        editingCells.delete(b.id);
      } else if (act === 'field-menu') {
        const group = e.target.closest('[data-group]').dataset.group;
        if (fieldMenus.get(b.id) === group) fieldMenus.delete(b.id);
        else fieldMenus.set(b.id, group);
      } else if (act === 'field-on' || act === 'hide-col' || act === 'field-custom') {
        const sectionItems = b.items.filter(i => i.group === e.target.closest('[data-group]').dataset.group);
        if (act === 'field-custom') {
          const label = prompt('Name of the field')?.trim();
          if (!label) return;
          const f = { key: `custom-${fieldKey(label)}`, label, kind: 'text', scope: 'protocol', unit: '', options: [] };
          sectionItems.forEach(i => { if (!i.custom.some(c => c.key === f.key)) i.custom.push({ ...f }); });
          sectionItems.forEach(i => { if (!i.on.includes(f.key)) i.on.push(f.key); });
        } else if (act === 'field-on') {
          sectionItems.filter(i => materialFields(b, i).some(f => f.key === key) && !i.on.includes(key)).forEach(i => i.on.push(key));
        } else {
          sectionItems.forEach(i => { i.on = i.on.filter(k => k !== key); });
        }
      } else return;
      renderBlock(b);
      save();
      refresh();
    },
    onMousedown(b, e) {
      const td = e.target.closest('td.mcell.editable');
      if (!td || td.classList.contains('editing') || isPicking() || e.button !== 0) return;
      e.preventDefault();
      editCell(b, td.closest('[data-item]').dataset.item, td.dataset.cell);
    },
    onFocusout(b, e) {
      const editing = editingCells.get(b.id);
      if (!editing || !e.target.closest('td.editing')) return;
      setTimeout(() => {
        if (editingCells.get(b.id) !== editing || bodyOf(b).querySelector('td.editing')?.contains(document.activeElement)) return;
        stopEditing(b);
      });
    },
    onKeydown(b, e) {
      const el = e.target;
      const td = el.closest('td.editing');
      if (suggestState?.input === el) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const last = suggestState.options.length - 1;
          suggestState.at = Math.max(0, Math.min(last, suggestState.at + (e.key === 'ArrowDown' ? 1 : -1)));
          drawSuggestions();
          return;
        }
        if (e.key === 'Enter' && suggestState.at >= 0) {
          e.preventDefault();
          acceptSuggestion(suggestState.at);
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          hideSuggestions();
          return;
        }
        hideSuggestions();
      }
      if (td && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        fillDown(b, td);
        return;
      }
      if (td && (e.key === 'Tab' || e.key === 'Enter' || e.key === 'Escape')) {
        e.preventDefault();
        if (e.key === 'Tab') moveEditing(b, td, e.shiftKey ? -1 : 1);
        else stopEditing(b);
        return;
      }
      if (!el.matches('.madd-name')) return;
      if (e.key === 'Escape') {
        el.value = '';
        pendingDuplicates.delete(b.id);
        bodyOf(b).querySelector('.mguess').innerHTML = guessLine(b, '');
        return;
      }
      if (e.key !== 'Enter' || !el.value.trim()) return;
      e.preventDefault();
      const row = reviewRow(b, materialFromGuess(b, guessMaterial(el.value, rememberedKinds())), '');
      if (!row.duplicate) {
        commitMaterials(b, [row]);
        return;
      }
      pendingDuplicates.set(b.id, row);
      bodyOf(b).querySelector('.mguess').innerHTML = duplicatePrompt(b);
    },
    onPaste(b, e) {
      if (!e.target.matches('.madd-name')) return;
      const text = e.clipboardData?.getData('text') ?? '';
      if (!/\n/.test(text.trim())) return;
      e.preventDefault();
      const known = rememberedKinds();
      const rows = splitPastedMaterials(text).map(row => {
        const guess = guessMaterial(row.text, known, row.context);
        return reviewRow(b, materialFromGuess(b, guess), guess.why);
      });
      if (!rows.length) return;
      materialPastes.set(b.id, { source: 'the paste', rows });
      renderBlock(b);
    },
  },

  list: {
    label: 'Table', glyph: '▤', hint: 'Your own columns', size: [12, 6],
    make: preset => {
      const p = LIST_PRESETS[preset ?? 'blank'];
      return { title: p.label, named: p.named, columns: p.columns(), items: [] };
    },
    render(b, body) {
      const run = isRun();
      const nameColumn = b.columns[0];
      const columns = b.columns.filter(c => c === nameColumn || !c.hidden);
      const editing = !run && openColumnEditors.has(b.id);
      const open = openRows.get(b.id);
      const unitOf = (row, c) => (c.unit === '*' ? (row.units?.[c.id] ?? '') : c.unit);
      const valueOf = (row, c) => (run ? effectiveValue({ id: `${row.id}:${c.id}`, value: row.cells[c.id] ?? '', perRun: c.perRun }) : row.cells[c.id] ?? '');
      const control = (row, c) => {
        const value = valueOf(row, c);
        const cls = ['in', c.kind === 'number' ? 'mono' : '', c === nameColumn ? 'lname' : ''].filter(Boolean).join(' ');
        const input = c.kind === 'choice'
          ? `<select class="${cls}" data-col="${c.id}">${['', ...c.options].map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
          : `<input class="${cls}" data-col="${c.id}"${c.kind === 'date' ? ' type="date"' : ''} value="${esc(value)}" spellcheck="false" />`;
        if (c.kind !== 'number') return input;
        const unit = unitOf(row, c);
        const unitControl = c.unit === '*' && !run
          ? `<select class="in lunit" data-unitcol="${c.id}">${VALUE_UNITS.map(u => `<option value="${esc(u)}"${u === unit ? ' selected' : ''}>${esc(u || 'none')}</option>`).join('')}</select>`
          : `<span class="unit">${esc(shortUnit(unit))}</span>`;
        return `<span class="ramt">${unit === '1:N' ? '<span class="pre">1:</span>' : ''}${input}${unitControl}</span>`;
      };
      const text = (row, c) => {
        const raw = valueOf(row, c);
        if (String(raw).trim()) return esc(displayOf({ unit: c.kind === 'number' ? unitOf(row, c) : '' }, raw));
        return '';
      };
      const head = columns.map(c => `<th>${esc(c.name)}</th>`).join('');
      const rows = b.items.map((row, i) => {
        const isOpen = row.id === open;
        const cells = columns.map(c => `<td>${isOpen || (run && c.perRun) ? control(row, c) : text(row, c)}</td>`).join('');
        const tools = isOpen ? `<span class="mrow-tools">${run ? '' : '<button class="lnk" data-act="del-row">Remove</button>'}<button class="lnk" data-act="close">Done</button></span>` : '';
        const pick = b.named ? ` data-pick="${esc(row.cells[nameColumn.id] ?? '')}"` : '';
        return `<tr class="mrow${i % 2 ? ' alt' : ''}${isOpen ? ' open' : ''}" data-item="${row.id}" data-act="open"${pick}>${cells}<td>${tools}</td></tr>`;
      }).join('');
      const hiddenCount = b.columns.filter(c => c.hidden).length;
      const tools = run ? '' : `<div class="ltools"><button class="lnk${editing ? ' on' : ''}" data-act="columns">Columns${hiddenCount ? ` · ${hiddenCount} hidden` : ''}</button><label><input type="checkbox" class="lnamed"${b.named ? ' checked' : ''} /> use rows in steps and formulas</label></div>`;
      body.innerHTML = `${tools}${editing ? this.columnEditor(b) : ''}<div class="mtable-wrap"><table class="mtab"><thead><tr>${head}<th></th></tr></thead><tbody>${rows}</tbody></table></div>${run ? '' : '<button class="add" data-act="add-row">+ Row</button>'}`;
    },
    columnEditor(b) {
      const option = (value, selected, label = value) => `<option value="${esc(value)}"${value === selected ? ' selected' : ''}>${esc(label)}</option>`;
      return `<div class="coledit">${b.columns.map((c, i) => {
        const kind = i === 0 ? '<span class="cfixed">row name</span>' : `<select class="in ckind">${COLUMN_KINDS.map(k => option(k, c.kind)).join('')}</select>`;
        const detail = c.kind === 'number'
          ? `<select class="in cunit">${COLUMN_UNITS.map(u => option(u, c.unit, u === '*' ? 'unit per row' : u || 'no unit')).join('')}</select>`
          : c.kind === 'choice' ? `<input class="in copts" value="${esc(c.options.join(', '))}" placeholder="options, comma separated" />` : '<span></span>';
        const flags = i === 0 ? '<span></span><span></span><span></span>'
          : `<label><input type="checkbox" class="crun"${c.perRun ? ' checked' : ''} /> each run</label><label><input type="checkbox" class="chide"${c.hidden ? ' checked' : ''} /> hide</label>${c.kind === 'date' ? `<label><input type="checkbox" class="cwarn"${c.warnPast ? ' checked' : ''} /> flag if past</label>` : '<span></span>'}`;
        const moves = `${i > 1 ? '<button data-act="col-left" title="Move left">←</button>' : ''}${i > 0 && i < b.columns.length - 1 ? '<button data-act="col-right" title="Move right">→</button>' : ''}${i > 0 ? '<button data-act="col-del" title="Remove column">×</button>' : ''}`;
        return `<div class="colrow${c.hidden ? ' hid' : ''}" data-colid="${c.id}"><input class="in cname" value="${esc(c.name)}" spellcheck="false" />${kind}${detail}${flags}<span class="ctools">${moves}</span></div>`;
      }).join('')}<button class="add" data-act="add-col">+ Column</button></div>`;
    },
    update(b, body) {
      const run = isRun();
      for (const row of b.items) {
        const tr = body.querySelector(`[data-item="${row.id}"]`);
        if (!tr) continue;
        tr.querySelector('.lname')?.classList.toggle('bad', b.named && calc.dupes.has(row.id));
        if (!run) continue;
        tr.querySelectorAll('[data-col]').forEach(el => {
          const c = b.columns.find(x => x.id === el.dataset.col);
          const key = `${row.id}:${c.id}`;
          const changed = !c.perRun && key in state.run.overrides;
          el.classList.toggle('changed', changed);
          el.classList.toggle('need', c.perRun && !String(el.value).trim());
          el.classList.toggle('expired', c.kind === 'date' && c.warnPast && !!el.value && el.value < TODAY_ISO);
          el.title = changed ? `Protocol says ${row.cells[c.id] || 'nothing'}` : '';
        });
      }
    },
    onInput(b, e) {
      const el = e.target;
      const row = b.items.find(i => i.id === el.closest('[data-item]')?.dataset.item);
      const column = b.columns.find(c => c.id === el.closest('[data-colid]')?.dataset.colid);
      if (row && el.dataset.col) {
        const c = b.columns.find(x => x.id === el.dataset.col);
        const key = `${row.id}:${c.id}`;
        if (!isRun()) row.cells[c.id] = el.value;
        else if (!c.perRun && el.value === (row.cells[c.id] ?? '')) delete state.run.overrides[key];
        else state.run.overrides[key] = el.value;
      } else if (row && el.dataset.unitcol) {
        (row.units ??= {})[el.dataset.unitcol] = el.value;
      } else if (column && el.matches('.cname')) column.name = el.value;
      else if (column && el.matches('.copts')) column.options = el.value.split(',').map(s => s.trim()).filter(Boolean);
      else return;
      save();
      refresh();
    },
    onChange(b, e) {
      const el = e.target;
      const column = b.columns.find(c => c.id === el.closest('[data-colid]')?.dataset.colid);
      if (el.matches('.lnamed')) b.named = el.checked;
      else if (column && el.matches('.ckind')) column.kind = el.value;
      else if (column && el.matches('.cunit')) column.unit = el.value;
      else if (column && el.matches('.crun')) column.perRun = el.checked;
      else if (column && el.matches('.chide')) column.hidden = el.checked;
      else if (column && el.matches('.cwarn')) column.warnPast = el.checked;
      else if (!el.matches('.cname, .copts, .lunit')) return;
      renderBlock(b);
      save();
      refresh();
    },
    onClick(b, e) {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act || (act === 'open' && (isPicking() || e.target.closest('input, select, button')))) return;
      const rowId = e.target.closest('[data-item]')?.dataset.item;
      const i = b.columns.findIndex(c => c.id === e.target.closest('[data-colid]')?.dataset.colid);
      let added = null;
      if (act === 'open') openRows.set(b.id, rowId);
      else if (act === 'close') openRows.delete(b.id);
      else if (act === 'columns') { if (openColumnEditors.has(b.id)) openColumnEditors.delete(b.id); else openColumnEditors.add(b.id); }
      else if (act === 'add-row') { added = { id: uid(), cells: {}, units: {} }; b.items.push(added); openRows.set(b.id, added.id); }
      else if (act === 'del-row') { b.items = b.items.filter(row => row.id !== rowId); openRows.delete(b.id); }
      else if (act === 'add-col') b.columns.push(newColumn(`Column ${b.columns.length + 1}`));
      else if (act === 'col-left') [b.columns[i - 1], b.columns[i]] = [b.columns[i], b.columns[i - 1]];
      else if (act === 'col-right') [b.columns[i + 1], b.columns[i]] = [b.columns[i], b.columns[i + 1]];
      else if (act === 'col-del' && confirm(`Remove the “${b.columns[i].name}” column and its values?`)) b.columns.splice(i, 1);
      else return;
      renderBlock(b);
      if (act === 'open' || added) bodyOf(b).querySelector('tr.open .in')?.focus();
      save();
      refresh();
    },
  },

  steps: {
    label: 'Steps', glyph: '≡', hint: 'The outline, ticked off on a run', size: [5, 8],

      const run = isRun();
      const nums = stepNumbers();

      const grip = run ? '' : '<span class="grip" title="Drag to move">⠿</span>';
      const groups = [];
      for (const s of state.steps) {
        if (s.kind === 'section' || !groups.length) groups.push({ section: s.kind === 'section' ? s : null, steps: [] });
        if (s.kind === 'step') groups[groups.length - 1].steps.push(s);
      }
      const duringOf = {};
      let lastMain = null;
      for (const s of state.steps) {
        if (s.kind !== 'step' || s.level === 2) continue;
        if (s.meanwhile) duringOf[s.id] = lastMain;
        else lastMain = nums[s.id].replace('.', '');
      }
      const row = s => {
        const done = !!state.run.done[s.id];
        const editing = !run && editingStepId === s.id;
        const cls = ['srow', s.level === 2 ? 'sub' : '', run && done ? 'done' : '', run && s.id === cur ? 'cur' : '', editing ? 'editing' : ''].join(' ');
        const tag = s.meanwhile && duringOf[s.id] ? `<span class="during">During step ${duringOf[s.id]}:</span>` : '';
        const content = editing
          ? `<div class="sedit" contenteditable="true" spellcheck="false" data-placeholder="Write the step">${editorHtml(s.text)}</div><div class="meta"><label><input type="checkbox" class="ssub"${s.level === 2 ? ' checked' : ''} /> sub-step</label><label><input type="checkbox" class="smw"${s.meanwhile ? ' checked' : ''} /> during the previous step</label>${trayToggleHtml(false)}</div>`
          : `<div class="sdisp">${tag}${templateHtml(s.text) || '<span class="hint">Click to write this step</span>'}</div>`;
        return `<div class="${cls}" data-step="${s.id}">${editing ? '' : grip}${run ? `<span class="chk">${done ? '✓' : ''}</span>` : ''}<span class="num">${nums[s.id]}</span><div class="body">${content}</div>${run || editing ? '' : tools}</div>`;
      };

        const head = section
          ? `<div class="sec-head" data-step="${section.id}">${grip}<span class="sec-num">${nums[section.id]}</span>${run ? `<span class="sec-title">${esc(section.text)}</span>` : `<input class="sec-title stext sectext" value="${esc(section.text)}" spellcheck="false" />`}<span class="sec-meta">${meta}</span>${run ? '' : tools}</div>`
          : '';
        const complete = run && steps.length && done === steps.length;
        return `<section class="sgroup${complete ? ' complete' : ''}">${head}<div class="${section ? 'sgroup-body' : ''}">${steps.map(row).join('')}</div></section>`;
      }).join('') + (run ? '' : '<div class="sadd"><button class="add" data-act="step">+ Step</button><button class="add" data-act="section">+ Section</button><button class="add" data-act="paste">Paste protocol</button></div>');

    update(b, body) {

        el.className = `ref ${r.cls}`;
      });

    onMousedown(b, e) {
      if (isRun() || e.button !== 0) return;
      const rowEl = e.target.closest('[data-step]');
      if (e.target.closest('.grip') && rowEl) { startStepDrag(rowEl.dataset.step, e); return; }
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'paste') { e.preventDefault(); openPasteModal(); return; }
      if (act === 'step' || act === 'section') {
        e.preventDefault();
        const s = act === 'step' ? { id: uid(), kind: 'step', level: 1, text: '', meanwhile: false } : { id: uid(), kind: 'section', text: 'New section' };
        state.steps.push(s);

        const added = bodyOf(b).querySelector(`[data-step="${s.id}"]`);
        if (act === 'step') focusEditor(added.querySelector('.sedit'));
        else { added.querySelector('.stext').focus(); added.querySelector('.stext').select(); }
        return;
      }
      if (!rowEl) return;
      const i = state.steps.findIndex(s => s.id === rowEl.dataset.step);
      const s = state.steps[i];
      if (act) {
        e.preventDefault();
        if (act === 'up') moveStepUp(i);
        if (act === 'down') moveStepDown(i);
        if (act === 'del') { state.steps.splice(i, 1); delete state.run.done[s.id]; }
        commitSteps();
        return;
      }
      if (s.kind === 'step' && editingStepId !== s.id && e.target.closest('.sdisp')) {
        e.preventDefault();
        editingStepId = s.id;
        commitSteps();
        focusEditor(bodyOf(b).querySelector(`[data-step="${s.id}"] .sedit`));

    onClick(b, e) {

    onChange(b, e) {

      commitSteps();
    },
  },

function workHtml(r, compact) {
  if (!r) return '';
  if (r.empty) return `<span class="hint">${esc(r.error)}</span>`;
  if (r.error) return `<span class="err">${esc(r.error)}</span>${r.missing ? `<button class="mk" data-name="${esc(r.missing)}">+ Add ‘${esc(r.missing)}’ as a value</button>` : ''}`;
  if (compact) return r.out.error ? `<span class="err">${esc(r.out.error)}</span>` : r.showWork ? `= ${r.html}` : '';
  const work = r.showWork ? `= ${r.html} ` : '';
  if (r.out.error) return `${work}<br><span class="err">${esc(r.out.error)}</span>`;
  return `${work}= <span class="res">${esc(r.out.text)}</span><span class="ok">✓ ${dimWords(r.q.d)}</span>`;
}

let editingStepId = null;
let stepsRendering = false;
let insertTarget = null;
const tray = document.getElementById('tray');
const NAME_KIND_CLASS = { value: 'v', formula: 'f', plate: 'p', item: 'r' };

function insertChip(editor, name) {
  const selection = getSelection();
  let range = selection.rangeCount && editor.contains(selection.getRangeAt(0).startContainer) ? selection.getRangeAt(0) : null;
  if (!range) { range = document.createRange(); range.selectNodeContents(editor); range.collapse(false); }
  range.deleteContents();
  const { startContainer, startOffset } = range;
  const charBefore = startContainer.nodeType === Node.TEXT_NODE ? startContainer.textContent[startOffset - 1] : '';
  const after = document.createTextNode(' ');
  range.insertNode(after);
  range.insertNode(chipNode(name));
  if (charBefore && /\S/.test(charBefore)) range.insertNode(document.createTextNode(' '));
  range.setStartAfter(after);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
  editor.dispatchEvent(new Event('input', { bubbles: true }));
}

function insertToken(token, isName) {
  const input = insertTarget;
  if (input.isContentEditable) { insertChip(input, token); return; }
  const isFormula = input.matches('.fexpr');
  let start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? start;
  const text = isName && !isFormula ? `{${token}}` : token;
  if (text === ')' && input.value[start - 1] === ' ') start -= 1;
  const lead = text !== ')' && /[^\s(]$/.test(input.value.slice(0, start)) ? ' ' : '';
  const trail = isFormula && text !== '(' ? ' ' : '';
  input.setRangeText(`${lead}${text}${trail}`, start, end, 'end');
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

let trayOpen = false;
const trayToggleLabel = isFormula => (trayOpen ? '− Hide the insert list' : isFormula ? '+ Insert a name or operator' : '+ Insert a value or a common step');
const trayToggleHtml = isFormula => `<button class="tray-toggle" data-tray-toggle>${trayToggleLabel(isFormula)}</button>`;
function showTray(input) {
  const isFormula = input.matches('.fexpr');
  const ownName = isFormula ? input.closest('.fedit').querySelector('.fname').value.trim().toLowerCase() : '';
  document.querySelectorAll('[data-tray-toggle]').forEach(button => { button.textContent = trayToggleLabel(isFormula); });
  tray.classList.toggle('on', trayOpen);
  if (!trayOpen) return;
  const groups = new Map();
  const add = (title, row) => groups.set(title, [...(groups.get(title) ?? []), row]);
  for (const entry of calc.names.values()) {
    if (entry.name.toLowerCase() === ownName || (isFormula && entry.kind === 'item')) continue;
    const title = entry.kind === 'item' ? entry.groupTitle : { value: 'Values', formula: 'Formulas', plate: 'Vessel counts' }[entry.kind];
    const shown = refInfo(entry.name).text;
    add(title, `<div class="tray-row" data-pick="${esc(entry.name)}"><span>${esc(entry.name)}</span>${shown !== entry.name ? `<span class="tv">${esc(shown)}</span>` : ''}</div>`);
  }
  const presets = isFormula ? '' : `<div class="tray-group">Common steps</div>${STEP_PRESETS.map((p, i) => `<div class="tray-row" data-preset="${i}"><span>${esc(p.label)}</span><span class="tv">${esc(p.text.replace(/[‹›]/g, ''))}</span></div>`).join('')}`;
  const ops = isFormula ? `<div class="tray-ops">${['+', '−', '×', '÷', '(', ')'].map(op => `<button class="pick" data-op="${op}">${op}</button>`).join('')}</div>` : '';
  tray.innerHTML = `<div class="tray-list">${ops}${presets}${[...groups].map(([title, rows]) => `<div class="tray-group">${esc(title)}</div>${rows.join('')}`).join('')}</div><div class="tray-tip">Click to insert, or drag into place. Names on the board can be dragged in too.${isFormula ? '' : ' Tab jumps between highlighted blanks.'}</div>`;
  placeTray();
}

function placeTray() {
  if (!insertTarget) return;
  const r = (insertTarget.closest('.srow, .fedit') ?? insertTarget).getBoundingClientRect();
  tray.style.width = `${Math.min(Math.max(r.width, 320), 420)}px`;
  tray.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - tray.offsetWidth - 8))}px`;
  tray.style.top = `${r.bottom + 6 + tray.offsetHeight > window.innerHeight ? r.top - tray.offsetHeight - 6 : r.bottom + 6}px`;
}

function addValueNamed(name) {
  let b = state.blocks.find(x => x.type === 'values');
  if (!b) b = addBlock('values');
  const it = { id: uid(), name, value: '', unit: '' };
  b.items.push(it);
  openRows.set(b.id, it.id);
  renderBlock(b);
  save();
  refresh();
  bodyOf(b).querySelector('.vedit .vval').focus();
}

const grid = GridStack.init({ column: 12, cellHeight: 44, margin: 10, handle: '.blk-head', float: false, animate: true, resizable: { handles: 'se' } }, '#board');
const resizeObserver = new ResizeObserver(entries => {
  for (const entry of entries) {
    const b = byId(entry.target.closest('.blk')?.dataset.id);
    if (b) TYPES[b.type].fit?.(b, entry.target);
  }
});

function renderBlock(b) {
  const T = TYPES[b.type];
  const body = bodyOf(b);
  const head = body.parentElement;
  head.querySelector('.blk-title').textContent = b.title;
  head.querySelector('.blk-kind').textContent = b.title === T.label ? '' : T.label;
  T.render(b, body);
  T.fit?.(b, body);
  T.update?.(b, body);
}

function mountBlock(b) {
  const T = TYPES[b.type];
  const el = document.createElement('div');
  el.className = 'grid-stack-item';
  Object.entries({ 'gs-id': b.id, 'gs-x': b.x, 'gs-y': b.y, 'gs-w': b.w, 'gs-h': b.h, 'gs-min-w': 2, 'gs-min-h': b.collapsed ? 1 : 2 }).forEach(([k, v]) => el.setAttribute(k, v));
  el.innerHTML = `<div class="grid-stack-item-content blk" data-id="${b.id}"><div class="blk-head"><button class="blk-fold" title="Collapse or expand"></button><span class="blk-glyph">${T.glyph}</span><span class="blk-title"></span><span class="blk-kind"></span><button class="blk-x" title="Remove block">×</button></div><div class="blk-body t-${b.type}"></div></div>`;
  document.getElementById('board').appendChild(el);
  grid.makeWidget(el);
  renderBlock(b);
  applyFold(b);
  resizeObserver.observe(bodyOf(b));
}

function applyFold(b) {
  const blk = document.querySelector(`.blk[data-id="${b.id}"]`);
  blk.classList.toggle('folded', !!b.collapsed);
  blk.querySelector('.blk-fold').textContent = b.collapsed ? '▸' : '▾';
}

function toggleFold(b) {
  const el = document.querySelector(`.blk[data-id="${b.id}"]`).parentElement;
  b.collapsed = !b.collapsed;
  if (b.collapsed) { b.openH = b.h; grid.update(el, { h: 1, minH: 1 }); }
  else grid.update(el, { h: b.openH ?? TYPES[b.type].size[1], minH: 2 });
  applyFold(b);
  save();
}

function addBlock(type, preset) {
  const T = TYPES[type];
  const [w, h] = T.size;
  const b = { id: uid(), type, title: T.label, x: 0, y: Math.max(0, ...state.blocks.map(x => x.y + x.h)), w, h, ...T.make(preset) };
  state.blocks.push(b);
  mountBlock(b);
  save();
  refresh();
  const wrap = document.getElementById('boardWrap');
  wrap.scrollTo({ top: wrap.scrollHeight, behavior: 'smooth' });
  return b;
}

function removeBlock(b) {
  if (!confirm(`Remove the “${b.title}” block?`)) return;
  grid.removeWidget(document.querySelector(`.blk[data-id="${b.id}"]`).parentElement);
  state.blocks = state.blocks.filter(x => x.id !== b.id);
  save();
  refresh();
}

function refresh() {
  recompute();
  state.blocks.forEach(b => TYPES[b.type].update?.(b, bodyOf(b)));
  updateBar();
}

function runTally() {
  const overrides = state.run.overrides;
  let changed = 0;
  let toFill = 0;
  for (const b of state.blocks) {
    if (b.type === 'values') changed += b.items.filter(it => it.id in overrides).length;
    if (b.type === 'materials') {
      for (const item of b.items.filter(i => i.name.trim())) {
        for (const f of materialFields(b, item).filter(x => item.on.includes(x.key))) {
          const key = `${item.id}:${f.key}`;
          if (f.scope !== 'protocol') toFill += String(overrides[key] ?? '').trim() ? 0 : 1;
          else if (key in overrides) changed++;
        }
      }
    }
    if (b.type !== 'list') continue;
    for (const row of b.items.filter(r => String(r.cells[b.columns[0].id] ?? '').trim())) {
      for (const c of b.columns) {
        const key = `${row.id}:${c.id}`;
        if (c.perRun) toFill += String(overrides[key] ?? '').trim() ? 0 : 1;
        else if (key in overrides) changed++;
      }
    }
  }
  return { changed, toFill };
}

function updateBar() {
  const { changed, toFill } = runTally();
  const steps = state.steps.filter(s => s.kind === 'step');
  const done = steps.filter(s => state.run.done[s.id]).length;
  const plural = (n, word) => `<b>${n}</b> ${word}${n === 1 ? '' : 's'}`;
  document.getElementById('runinfo').innerHTML = isRun()
    ? `Run · ${TODAY} · ${plural(changed, 'change')} from the protocol · ${plural(toFill, 'field')} to record · ${done} of ${steps.length} steps done`
    : 'Building. Drag a block by its title, resize from the corner.';
}

function setMode(mode) {
  state.mode = mode;
  document.body.classList.toggle('run', mode === 'run');
  document.body.classList.toggle('build', mode === 'build');
  document.querySelectorAll('.modes button').forEach(btn => btn.classList.toggle('on', btn.dataset.mode === mode));
  grid.setStatic(mode === 'run');
  recompute();
  state.blocks.forEach(renderBlock);
  updateBar();
  save();
}

const RAIL = [
  ['Inputs', [{ type: 'materials' }]],
  ['Write', ['text', 'steps', 'flow', 'sketch'].map(type => ({ type }))],
  ['Numbers', ['values', 'formula', 'list'].map(type => ({ type, preset: type === 'list' ? 'blank' : undefined }))],
  ['Layout', [{ type: 'plate' }]],
];
document.getElementById('rail').innerHTML = RAIL.map(([group, entries]) => `<h4>${group}</h4>${entries.map(({ type, preset }) => {
  const info = preset ? LIST_PRESETS[preset] : TYPES[type];
  return `<button data-type="${type}"${preset ? ` data-preset="${preset}"` : ''}><span class="g">${TYPES[type].glyph}</span><span><span class="n">${info.label}</span><span class="h">${info.hint}</span></span></button>`;
}).join('')}`).join('')
  + '<p class="tip">Every table is yours to shape: add, rename, hide or reorder columns. Rows and their numbers can be clicked into steps and formulas.</p>';
document.getElementById('rail').addEventListener('click', e => {
  const btn = e.target.closest('[data-type]');
  if (btn) addBlock(btn.dataset.type, btn.dataset.preset);
});

const titleInput = document.getElementById('title');
titleInput.value = state.title;
titleInput.addEventListener('input', () => { state.title = titleInput.value; save(); });
document.querySelectorAll('.modes button').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
document.getElementById('resetRun').addEventListener('click', () => {
  if (!confirm('Clear today\'s recorded values, changes and ticks?')) return;
  state.run = { overrides: {}, done: {} };
  setMode('run');
});
document.getElementById('example').addEventListener('change', e => {
  const key = e.target.value;
  e.target.value = '';
  if (!key || !confirm('Replace this board with the example? Changes here are lost.')) return;
  clearTimeout(saveTimer);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(EXAMPLES[key]())); } catch {}
  location.reload();
});

const board = document.getElementById('board');
const handlerName = type => `on${type[0].toUpperCase()}${type.slice(1)}`;
['input', 'change', 'click', 'focusout', 'pointerdown', 'pointerover', 'mousedown', 'keydown', 'paste'].forEach(type => board.addEventListener(type, e => {
  const b = byId(e.target.closest?.('.blk')?.dataset.id);
  if (!b) return;
  if (type === 'click' && e.target.closest('.blk-x')) { removeBlock(b); return; }
  if (type === 'click' && e.target.closest('.blk-fold')) { toggleFold(b); return; }
  TYPES[b.type][handlerName(type)]?.call(TYPES[b.type], b, e);
}));
board.addEventListener('keydown', e => {
  if (e.key === 'Tab' && e.target.matches('.sedit') && jumpToSlot(e.target, e.shiftKey)) { e.preventDefault(); return; }
  if (e.key !== 'Enter' || e.target.closest('td.editing') || !e.target.matches('input.in:not(.madd-name), input.sec-title, .sedit')) return;
  e.preventDefault();
  e.target.blur();
});
board.addEventListener('dblclick', e => {
  const title = e.target.closest('.blk-title');
  if (!title || isRun()) return;
  const b = byId(title.closest('.blk').dataset.id);
  const name = prompt('Block title', b.title);
  if (name) { b.title = name; renderBlock(b); save(); }
});
window.addEventListener('pointerup', () => { vesselDrag = null; });
document.addEventListener('focusin', e => {
  if (!e.target.matches?.('.fexpr, .sedit')) return;
  insertTarget = e.target;
  document.body.classList.add('picking');
  showTray(e.target);
});
document.addEventListener('focusout', e => {
  if (e.target !== insertTarget) return;
  insertTarget = null;
  document.body.classList.remove('picking');
  tray.classList.remove('on');
});
let nameDrag = null;
document.addEventListener('mousedown', e => {
  if (!insertTarget || e.button !== 0) return;
  if (e.target.closest('[data-tray-toggle]')) { e.preventDefault(); trayOpen = !trayOpen; showTray(insertTarget); return; }
  const preset = e.target.closest('[data-preset]');
  if (preset && insertTarget.isContentEditable) {
    e.preventDefault();
    insertPreset(insertTarget, STEP_PRESETS[+preset.dataset.preset]);
    return;
  }
  const op = e.target.closest('[data-op]');
  const pick = e.target.closest('[data-pick], .vname, .fname, .lname');
  if (!op && !pick) return;
  if (pick === insertTarget || (pick?.matches('.fname') && pick.closest('.fedit') === insertTarget.closest('.fedit'))) return;
  const token = op ? op.dataset.op : (pick.dataset.pick ?? pick.value).trim();
  if (!token) return;
  e.preventDefault();
  nameDrag = { token, isName: !op, x: e.clientX, y: e.clientY, moved: false, ghost: null };
}, true);

document.addEventListener('mousemove', e => {
  if (nameDrag) {
    if (!nameDrag.moved && Math.hypot(e.clientX - nameDrag.x, e.clientY - nameDrag.y) < 5) return;
    if (!nameDrag.moved) {
      nameDrag.moved = true;
      nameDrag.ghost = Object.assign(document.createElement('div'), { className: 'drag-ghost', textContent: nameDrag.token });
      document.body.append(nameDrag.ghost);
    }
    nameDrag.ghost.style.transform = `translate(${e.clientX + 12}px, ${e.clientY + 10}px)`;
    const over = document.elementFromPoint(e.clientX, e.clientY);
    insertTarget?.classList.toggle('drop-ok', !!over && (over === insertTarget || insertTarget.contains(over)));
    return;
  }
  if (!stepDrag) return;
  if (!stepDrag.moved && Math.hypot(e.clientX - stepDrag.x, e.clientY - stepDrag.y) < 4) return;
  stepDrag.moved = true;
  clearStepDropMarks();
  document.querySelectorAll(`[data-step="${stepDrag.id}"]`).forEach(el => el.classList.add('dragging'));
  const row = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-step]');
  stepDrag.target = null;
  if (!row || row.dataset.step === stepDrag.id) return;
  const rect = row.getBoundingClientRect();
  const after = e.clientY > rect.top + rect.height / 2;
  row.classList.add(after ? 'drop-after' : 'drop-before');
  stepDrag.target = { id: row.dataset.step, after };
});

document.addEventListener('mouseup', e => {
  if (nameDrag) {
    const drag = nameDrag;
    nameDrag = null;
    drag.ghost?.remove();
    if (!insertTarget) return;
    insertTarget.classList.remove('drop-ok');
    if (drag.moved) {
      const over = document.elementFromPoint(e.clientX, e.clientY);
      if (!over || !(over === insertTarget || insertTarget.contains(over))) return;
      const range = insertTarget.isContentEditable ? caretRangeAt(e.clientX, e.clientY) : null;
      if (range && insertTarget.contains(range.startContainer)) { getSelection().removeAllRanges(); getSelection().addRange(range); }
    }
    insertToken(drag.token, drag.isName);
    return;
  }
  if (!stepDrag) return;
  const drag = stepDrag;
  stepDrag = null;
  clearStepDropMarks();
  if (!drag.moved || !drag.target) return;
  moveStepBlock(drag.id, drag.target.id, drag.target.after);
  commitSteps();
}, true);

document.getElementById('boardWrap').addEventListener('scroll', placeTray);

const pasteModal = document.getElementById('pasteModal');
const pasteText = document.getElementById('pasteText');
const pastePreview = document.getElementById('pastePreview');
const pasteAdd = document.getElementById('pasteAdd');
let pasteItems = [];
function renderPastePreview() {
  pasteItems = parseProtocolText(pasteText.value);
  let sections = 0;
  let steps = 0;
  let subs = 0;
  pastePreview.innerHTML = pasteItems.length ? pasteItems.map(item => {
    if (item.kind === 'section') { subs = 0; return `<div class="pp-sec"><span>${roman(++sections)}.</span>${esc(item.text)}</div>`; }
    if (item.level === 2) return `<div class="pp-row sub"><span>${String.fromCharCode(97 + subs++)}.</span>${esc(item.text)}</div>`;
    subs = 0;
    return `<div class="pp-row"><span>${++steps}.</span>${esc(item.text)}</div>`;
  }).join('') : '<p class="hint">The outline appears here as you paste.</p>';
  const count = pasteItems.filter(i => i.kind === 'step').length;
  pasteAdd.disabled = !count;
  pasteAdd.lastChild.textContent = count ? `Add ${count} Step${count === 1 ? '' : 's'}` : 'Add Steps';
}
function openPasteModal() {
  pasteModal.hidden = false;
  pasteText.value = '';
  renderPastePreview();
  pasteText.focus();
}
pasteText.addEventListener('input', renderPastePreview);
document.getElementById('pasteExample').addEventListener('click', () => { pasteText.value = PASTE_EXAMPLE; renderPastePreview(); });
document.getElementById('pasteCancel').addEventListener('click', () => { pasteModal.hidden = true; });
pasteAdd.addEventListener('click', () => {
  state.steps.push(...pasteItems.map(item => ({ id: uid(), ...item })));
  pasteModal.hidden = true;
  commitSteps();
});

grid.on('change', (e, items) => {
  if (!items) return;
  items.forEach(it => { const b = byId(it.id); if (b) Object.assign(b, { x: it.x, y: it.y, w: it.w, h: it.h }); });
  save();
});

recompute();
grid.batchUpdate();
state.blocks.forEach(mountBlock);
grid.batchUpdate(false);
setMode(state.mode);
</script>
</body>
</html>
