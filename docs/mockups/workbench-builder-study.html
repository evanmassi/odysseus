<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Odysseus // Workbench · Builder Study</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../client/src/shared/styles/fonts/fonts.css" />
<link rel="stylesheet" href="../../client/src/shared/styles/base/variables.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" />
<style>
  :root { --fg: var(--foreground); --pri: var(--primary); --amber: 38 84% 65%; --green: 122 39% 59%; --red: 0 56% 66%; --violet: 265 62% 78%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; color: hsl(var(--fg)); background: hsl(var(--page)); overflow: hidden; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: hsl(var(--muted-foreground) / .25); border-radius: 10px; }

  .app { height: 100vh; display: flex; flex-direction: column; background-color: hsl(var(--page)); background-image: repeating-linear-gradient(0deg, hsl(var(--foreground) / .013) 0 1px, transparent 1px 26px), repeating-linear-gradient(90deg, hsl(var(--foreground) / .013) 0 1px, transparent 1px 26px); }
  .top { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: hsl(var(--background)); border-bottom: 1px solid hsl(var(--primary) / .2); font-family: 'JetBrains Mono', monospace; }
  .top .logo { letter-spacing: .3em; color: hsl(var(--muted-foreground)); font-size: 14px; }
  .top .rule { width: 1px; height: 18px; margin: 0 6px; background: hsl(var(--foreground) / .2); }
  .top .sq { width: 3px; height: 3px; background: hsl(var(--primary)); box-shadow: 0 0 6px hsl(var(--primary) / calc(.7 * var(--lit))); }
  .top .crumb { text-transform: uppercase; font-size: 12px; letter-spacing: .2em; color: hsl(var(--fg)); }

  .bar { flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 16px 24px 6px; flex-wrap: wrap; }
  .bar .title { font: 400 26px/1.1 'Hanken Grotesk', sans-serif; letter-spacing: -.015em; background: transparent; border: 1px solid transparent; color: hsl(var(--fg)); padding: 2px 6px; width: 340px; }
  .bar .title:hover, .bar .title:focus { border-color: hsl(var(--line-soft)); outline: none; }
  .modes { display: flex; border: 1px solid hsl(var(--line-mid)); }
  .modes button { background: none; border: 0; padding: 6px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: hsl(var(--muted-foreground)); cursor: pointer; }
  .modes button.on { color: hsl(var(--fg)); background: hsl(var(--pri) / .16); box-shadow: inset 0 -2px 0 hsl(var(--pri)); }
  .runinfo { font-size: 13px; color: hsl(var(--muted-foreground)); }
  .runinfo b { color: hsl(var(--amber)); font-weight: 600; }
  .lnk { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; background: transparent; border: 1px solid transparent; font: 400 14px/1 'JetBrains Mono', monospace; color: hsl(var(--muted-foreground)); cursor: pointer; white-space: nowrap; transition: color .15s, text-shadow .15s; }
  .lnk:hover { color: hsl(var(--fg)); text-shadow: 0 0 8px color-mix(in srgb, currentColor calc(55% * var(--lit)), transparent); }
  .build #resetRun { display: none; }

  .main { flex: 1; min-height: 0; display: flex; }
  .rail { width: 224px; flex-shrink: 0; padding: 4px 8px 16px 16px; overflow-y: auto; }
  .run .rail { display: none; }
  .rail h4 { margin: 20px 8px 8px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: hsl(var(--foreground) / .45); }
  .rail button { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; cursor: pointer; align-items: flex-start; }
  .rail button:hover { background: var(--scanline-layer), linear-gradient(90deg, hsl(var(--primary) / .12) 0%, hsl(var(--primary) / .05) 55%, transparent 100%); box-shadow: inset 3px 0 0 0 hsl(var(--primary) / .7); }
  .rail .g { width: 18px; flex-shrink: 0; text-align: center; color: hsl(var(--primary)); font-family: 'JetBrains Mono', monospace; filter: drop-shadow(0 0 5px hsl(var(--primary) / calc(.75 * var(--lit)))); }
  .rail .n { display: block; font-size: 14px; }
  .rail .h { display: block; font-size: 12px; color: hsl(var(--muted-foreground)); line-height: 1.35; margin-top: 2px; }
  .rail .tip { font-size: 12px; color: hsl(var(--muted-foreground)); margin: 18px 4px 0; line-height: 1.5; }
  .rail code, .shelp code { font-family: 'JetBrains Mono', monospace; color: hsl(var(--amber)); }

  .board-wrap { flex: 1; min-width: 0; overflow-y: auto; padding: 4px 16px 80px 4px; }
  #board { min-height: 100%; }
  .build #board { background-image: linear-gradient(90deg, hsl(var(--primary) / .025) 0 calc(100% - 20px), transparent 0); background-size: calc(100% / 12) 100%; background-position: 10px 0; }

  .grid-stack-item-content.blk { display: flex; flex-direction: column; overflow: hidden; border: 1px solid hsl(var(--line-soft)); background: linear-gradient(180deg, hsl(var(--foreground) / calc(.016 * var(--lit))) 0%, transparent 12%), radial-gradient(ellipse 100% 130% at 0% 0%, hsl(var(--primary) / calc(.018 * var(--lit))), transparent 68%), radial-gradient(ellipse 75% 85% at 100% 100%, hsl(var(--primary) / calc(.023 * var(--lit))), transparent 66%), radial-gradient(ellipse 70% 80% at 100% 100%, hsl(var(--shade) / calc(.035 * var(--lit))), transparent 62%), hsl(var(--card)); box-shadow: 0 20px 44px -24px hsl(var(--recess) / .65); }
  .grid-stack-placeholder > .placeholder-content { background: hsl(var(--pri) / .08) !important; border: 1px dashed hsl(var(--pri) / .55); }
  .blk-head { flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 12px 10px 10px 16px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-size: 15px; font-weight: 600; line-height: 1.1; letter-spacing: .08em; color: hsl(var(--fg)); cursor: grab; user-select: none; white-space: nowrap; }
  .run .blk-head { cursor: default; }
  .blk-glyph { color: hsl(var(--primary)); font-weight: 400; letter-spacing: 0; filter: drop-shadow(0 0 5px hsl(var(--primary) / calc(.75 * var(--lit)))); }
  .blk-title { overflow: hidden; text-overflow: ellipsis; }
  .blk-kind { margin-left: auto; font-size: 12px; font-weight: 400; color: hsl(var(--foreground) / .35); }
  .blk-x { background: none; border: 0; color: hsl(var(--muted-foreground)); cursor: pointer; font-size: 15px; padding: 0 4px; line-height: 1; }
  .blk-x:hover { color: hsl(var(--red)); }
  .run .blk-x { display: none; }
  .blk-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 16px; }

  .in { height: 28px; background: hsl(var(--input-well)); border: 1px solid hsl(var(--line-faint)); color: hsl(var(--fg)); font: inherit; font-size: 14px; padding: 0 8px; border-radius: 0; min-width: 0; transition: border-color .2s, background .2s, box-shadow .2s; }
  .in:hover { border-color: hsl(var(--foreground) / .3); }
  .in::placeholder { color: hsl(var(--foreground) / .4); }
  .in.mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .in:focus { outline: none; border-color: hsl(var(--primary) / .7); background: hsl(var(--primary) / .04); box-shadow: var(--input-focus-shadow); }
  .in.bad { border-color: hsl(var(--red) / .75); }
  select.in { padding: 0 4px; }
  select.in option { background: hsl(var(--card)); }
  .add { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; background: transparent; border: 1px solid transparent; font: 400 14px/1 'JetBrains Mono', monospace; color: hsl(var(--muted-foreground)); cursor: pointer; white-space: nowrap; }
  .add.primary { height: 32px; padding: 0 12px; gap: 8px; font-size: 15px; color: hsl(var(--fg)); background: hsl(var(--primary) / .1); border-color: hsl(var(--primary) / .45); box-shadow: inset 0 0 12px -2px hsl(var(--primary) / calc(.2 * var(--lit))), 0 0 14px -4px hsl(var(--primary) / calc(.4 * var(--lit))); }
  .add.primary .plus { color: hsl(var(--primary)); }
  .add.primary:hover { background: hsl(var(--primary) / .2); border-color: hsl(var(--primary)); box-shadow: inset 0 0 16px -2px hsl(var(--primary) / calc(.35 * var(--lit))), 0 0 22px -2px hsl(var(--primary) / calc(.55 * var(--lit))); }
  .add:hover { color: hsl(var(--fg)); }
  .ix { background: none; border: 0; color: hsl(var(--muted-foreground)); cursor: pointer; padding: 0 4px; font-size: 14px; }
  .ix:hover { color: hsl(var(--red)); }
  .hint { color: hsl(var(--muted-foreground)); font-style: italic; font-family: 'Hanken Grotesk', sans-serif; }

  .pre { color: hsl(var(--muted-foreground)); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .unit { color: hsl(var(--muted-foreground)); font-size: 12.5px; }
  .vlist, .flist { display: flex; flex-direction: column; }
  .vrow, .frow { padding: 8px 10px; cursor: pointer; }
  .vlist > :nth-child(even), .flist > :nth-child(even) { background: hsl(var(--foreground) / .035); }
  .vrow:hover, .frow:hover { background: var(--scanline-layer), linear-gradient(90deg, hsl(var(--primary) / .12) 0%, hsl(var(--primary) / .05) 55%, transparent 100%); box-shadow: inset 3px 0 0 0 hsl(var(--primary) / .7); }
  .vrow { display: flex; align-items: baseline; gap: 10px; }
  .vn { flex: 1; min-width: 0; font-size: 14px; }
  .vv { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: hsl(var(--fg)); white-space: nowrap; }
  .vrow.bad .vv { color: hsl(var(--red)); }
  .vrow.changed .vv { text-decoration: underline dotted hsl(var(--amber)); text-underline-offset: 3px; }
  .was { margin-left: 8px; font: 12px 'Hanken Grotesk', sans-serif; color: hsl(var(--muted-foreground)); }
  .vedit, .fedit { padding: 10px; background: var(--scanline-layer), linear-gradient(90deg, hsl(var(--primary) / .22) 0%, hsl(var(--primary) / .09) 55%, hsl(var(--primary) / .03) 100%) !important; box-shadow: inset 3px 0 0 0 hsl(var(--primary)), inset 14px 0 30px -12px hsl(var(--primary) / .25); }
  .vedit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .vedit .vname { flex: 1 1 100%; }
  .vedit .vn { flex: 1 1 100%; font-weight: 600; }
  .vedit .ramt { flex: 1; display: flex; align-items: center; gap: 3px; }
  .vedit .vval { flex: 1; min-width: 0; text-align: right; }
  .vtools, .ftools { flex-basis: 100%; display: flex; justify-content: flex-end; gap: 6px; }
  .ftools { margin-top: 8px; }
  .fl1, .fl2 { display: flex; gap: 6px; align-items: center; }
  .fl2 { margin-top: 5px; }
  .fname { flex: 1; font-weight: 600; }
  .fl2 .eq { color: hsl(var(--muted-foreground)); font-family: 'JetBrains Mono', monospace; }
  .fexpr { flex: 1; }
  .fwork { margin-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; color: hsl(var(--muted-foreground)); }
  .fwork:empty { display: none; }
  .fedit .fwork { margin-top: 6px; }
  .res { color: hsl(var(--fg)); font-weight: 600; }
  .ok { color: hsl(var(--muted-foreground)); font-size: 12px; margin-left: 8px; font-family: 'Hanken Grotesk', sans-serif; white-space: nowrap; }
  .err { color: hsl(var(--red)); font-family: 'Hanken Grotesk', sans-serif; font-size: 12.5px; }
  .mk { margin-left: 8px; background: none; border: 1px dashed hsl(var(--amber) / .6); color: hsl(var(--amber)); font-size: 12px; padding: 1px 8px; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
  .r-value, .r-formula, .r-plate, .r-item { color: hsl(var(--fg)); }
  .fhead { display: flex; align-items: baseline; gap: 10px; }
  .fname-ro { font-size: 14px; font-weight: 600; }
  .fres { margin-left: auto; font-family: 'JetBrains Mono', monospace; color: hsl(var(--fg)); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .fexpr-ro { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 3px; }
  .vlist + .add { margin-top: 10px; }
  .fadd { display: flex; gap: 8px; margin-top: 10px; }

  .sgroup { margin-bottom: 18px; }
  .sec-head { display: flex; align-items: center; gap: 12px; padding: 4px 4px 8px; margin-bottom: 6px; background: linear-gradient(90deg, hsl(var(--foreground) / .18) 0%, hsl(var(--foreground) / .1) 70%, hsl(var(--foreground) / .05) 100%) bottom / 100% 1px no-repeat; }
  .sec-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: hsl(var(--primary)); min-width: 30px; text-align: right; }
  .sec-title { flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-size: 14px; font-weight: 600; letter-spacing: .12em; }
  input.sec-title { background: transparent; border: 1px solid transparent; color: hsl(var(--fg)); padding: 2px 5px; }
  input.sec-title:hover, input.sec-title:focus { outline: none; border-color: hsl(var(--line-mid)); }
  .sec-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: hsl(var(--foreground) / .35); white-space: nowrap; }
  .sgroup.complete .sec-head { border-bottom-color: hsl(var(--green) / .7); }
  .sgroup.complete .sec-num, .sgroup.complete .sec-meta { color: hsl(var(--green)); }
  .sgroup-body { margin-left: 22px; padding-left: 10px; border-left: 1px solid hsl(var(--line-mid)); }
  .srow { display: flex; gap: 10px; align-items: baseline; padding: 6px 6px; border-radius: 2px; font-size: 14px; }
  .srow .num { font-family: 'JetBrains Mono', monospace; color: hsl(var(--muted-foreground)); min-width: 22px; text-align: right; font-size: 12.5px; flex-shrink: 0; }
  .srow.sub { margin-left: 32px; padding-top: 3px; padding-bottom: 3px; font-size: 13px; color: hsl(var(--fg) / .88); }
  .srow.sub .num { min-width: 14px; font-size: 11.5px; }
  .srow .body { flex: 1; min-width: 0; }
  .srow .body .in { width: 100%; }
  .sdisp { cursor: text; line-height: 1.5; }
  .run .srow { cursor: pointer; }
  .srow.editing { background: hsl(var(--primary) / .04); }
  .meta { display: flex; gap: 14px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .meta label { font-size: 12px; color: hsl(var(--muted-foreground)); display: flex; align-items: center; gap: 4px; }
  .during { font-style: italic; color: hsl(var(--muted-foreground)); margin-right: 4px; }
  .tools { display: flex; gap: 0; opacity: 0; flex-shrink: 0; }
  .srow:hover .tools, .sec-head:hover .tools { opacity: 1; }
  .tools button { background: none; border: 0; color: hsl(var(--muted-foreground)); cursor: pointer; padding: 0 4px; }
  .tools button:hover { color: hsl(var(--fg)); }
  .run ruby.r-item rt { color: hsl(var(--violet) / .85); }
  .ref, .tok { color: hsl(var(--fg)); border-bottom: 1px dotted hsl(var(--primary) / .7); }
  .ref { cursor: help; }
  .ref.r-item, .tok.r-item { font-weight: 600; }
  .ref.missing, .tok.missing { color: hsl(var(--red)); }
  .grip { width: 12px; flex-shrink: 0; align-self: center; color: hsl(var(--foreground) / .25); cursor: grab; user-select: none; font-size: 13px; line-height: 1; opacity: 0; transition: opacity .15s; }
  .srow:hover .grip, .sec-head:hover .grip { opacity: 1; }
  .grip:hover { color: hsl(var(--primary)); }
  .dragging { opacity: .35; }
  .drop-before { box-shadow: inset 0 2px 0 hsl(var(--primary)); }
  .drop-after { box-shadow: inset 0 -2px 0 hsl(var(--primary)); }
  .slot { background: hsl(var(--amber) / .12); border-bottom: 1px dashed hsl(var(--amber) / .75); padding: 0 2px; }
  .sedit.drop-ok { box-shadow: var(--input-focus-shadow), 0 0 0 2px hsl(var(--primary) / .55); }
  .drag-ghost { position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none; padding: 3px 10px; border: 1px solid hsl(var(--primary) / .6); background: hsl(var(--card)); font: 12px 'JetBrains Mono', monospace; color: hsl(var(--fg)); box-shadow: 0 10px 24px -8px hsl(var(--recess) / .8); }
  .modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(0, 0, 0, .55); }
  .modal[hidden] { display: none; }
  .modal-card { width: min(1040px, 92vw); max-height: 86vh; display: flex; flex-direction: column; border: 1px solid hsl(var(--line-soft)); background: linear-gradient(180deg, hsl(var(--primary) / calc(.032 * var(--lit))) 0%, transparent 17%), hsl(var(--card)); box-shadow: 0 30px 80px -24px hsl(var(--recess) / .85), 0 0 60px -16px hsl(var(--primary) / calc(.063 * var(--lit))); }
  .modal-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px 10px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-size: 15px; font-weight: 600; letter-spacing: .08em; }
  .modal-head .blk-glyph { text-transform: none; }
  .modal-sub { padding: 0 16px 12px; font-size: 14px; color: hsl(var(--muted-foreground)); }
  .modal-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 16px 16px; }
  .modal-body textarea { min-height: 420px; resize: none; padding: 10px 12px; background: hsl(var(--input-well)); border: 1px solid hsl(var(--line-faint)); color: hsl(var(--fg)); font: 13px/1.55 'JetBrains Mono', monospace; }
  .modal-body textarea:focus { outline: none; border-color: hsl(var(--primary) / .7); box-shadow: var(--input-focus-shadow); }
  .paste-preview { overflow: auto; padding: 4px 4px 4px 0; }
  .pp-sec { display: flex; gap: 10px; margin: 14px 0 6px; padding-bottom: 6px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-size: 13px; font-weight: 600; letter-spacing: .12em; background: linear-gradient(90deg, hsl(var(--foreground) / .18), hsl(var(--foreground) / .05)) bottom / 100% 1px no-repeat; }
  .pp-sec:first-child { margin-top: 0; }
  .pp-sec span { color: hsl(var(--primary)); }
  .pp-row { display: flex; gap: 10px; padding: 4px 0 4px 18px; font-size: 14px; line-height: 1.5; }
  .pp-row.sub { padding-left: 48px; font-size: 13px; color: hsl(var(--fg) / .88); }
  .pp-row span { flex-shrink: 0; min-width: 20px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: hsl(var(--muted-foreground)); }
  .modal-foot { position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; }
  .modal-foot::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent 0%, hsl(var(--primary) / .2) 10%, hsl(var(--primary) / .2) 90%, transparent 100%); }
  .modal-foot .lnk:first-child { margin-right: auto; }
  .add:disabled { opacity: .5; cursor: default; }
  .sedit { min-height: 21px; padding: 0 2px 2px; background: transparent; border: 0; box-shadow: inset 0 -1px 0 hsl(var(--primary) / .6); white-space: pre-wrap; line-height: 1.5; outline: none; cursor: text; }
  .sedit:empty::before { content: attr(data-placeholder); color: hsl(var(--muted-foreground)); font-style: italic; }
  .tok { user-select: all; cursor: default; }

  .in.need { border-color: hsl(var(--amber) / .75); background: hsl(var(--amber) / .07); }
  .in.expired { border-color: hsl(var(--red)); color: hsl(var(--red)); }
  .in.changed { border-color: hsl(var(--amber) / .85); background: hsl(var(--amber) / .1); }
  input[type="date"].in { color-scheme: dark; }
  .mtab .lname { font-weight: 600; }
  .mtable-wrap + .add { margin-top: 10px; }
  .ltools { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; font-size: 12px; color: hsl(var(--muted-foreground)); }
  .ltools label { display: flex; align-items: center; gap: 5px; }
  .lnk.on { color: hsl(var(--fg)); background: hsl(var(--primary) / .1); border-color: hsl(var(--primary) / .45); }
  .coledit { border: 1px solid hsl(var(--line-soft)); background: hsl(var(--fg) / .02); padding: 8px; margin-bottom: 10px; }
  .colrow { display: grid; grid-template-columns: minmax(120px, 1.2fr) 96px minmax(120px, 1.2fr) auto auto auto 76px; gap: 8px; align-items: center; margin-bottom: 5px; font-size: 12px; color: hsl(var(--muted-foreground)); }
  .colrow label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .colrow.hid .cname { opacity: .5; text-decoration: line-through; }
  .cfixed { font-size: 11.5px; font-style: italic; }
  .ctools { display: flex; gap: 2px; justify-content: flex-end; }
  .ctools button { background: none; border: 0; color: hsl(var(--muted-foreground)); cursor: pointer; padding: 0 4px; }
  .ctools button:hover { color: hsl(var(--fg)); }
  .runtag { margin-left: 6px; font-size: 8.5px; letter-spacing: .1em; color: hsl(var(--amber)); border: 1px solid hsl(var(--amber) / .45); padding: 0 4px; vertical-align: 1px; }
  .mrow select.in { max-width: 140px; }
  .mrow .ramt select.in { width: auto; }
  .blk-fold { background: none; border: 0; color: hsl(var(--muted-foreground)); cursor: pointer; font-size: 11px; padding: 0 2px; width: 16px; }
  .blk-fold:hover { color: hsl(var(--fg)); }
  .blk.folded .blk-body { display: none; }
  .blk.folded .blk-head { border-bottom: 0; height: 100%; }
  #example { background: hsl(var(--card)); }

<script id="engine">
const UNITS = {
  '': { f: 1, d: {} },
  '%': { f: 0.01, d: {} },
  'x': { f: 1, d: {} },
  '1:N': { f: 1, d: {}, ratio: true },
  'nL': { f: 1e-9, d: { vol: 1 } },
  'µL': { f: 1e-6, d: { vol: 1 } },
  'mL': { f: 1e-3, d: { vol: 1 } },
  'L': { f: 1, d: { vol: 1 } },
  'pg': { f: 1e-12, d: { mass: 1 } },
  'ng': { f: 1e-9, d: { mass: 1 } },
  'µg': { f: 1e-6, d: { mass: 1 } },
  'mg': { f: 1e-3, d: { mass: 1 } },
  'cells': { f: 1, d: { cell: 1 } },
  'cells/mL': { f: 1e3, d: { cell: 1, vol: -1 } },
  'pg/mL': { f: 1e-9, d: { mass: 1, vol: -1 } },
  'ng/mL': { f: 1e-6, d: { mass: 1, vol: -1 } },
  'µg/mL': { f: 1e-3, d: { mass: 1, vol: -1 } },
  'mg/mL': { f: 1, d: { mass: 1, vol: -1 } },
  'ng/µL': { f: 1e-3, d: { mass: 1, vol: -1 } },
  'nM': { f: 1e-9, d: { mol: 1, vol: -1 } },
  'µM': { f: 1e-6, d: { mol: 1, vol: -1 } },
  'mM': { f: 1e-3, d: { mol: 1, vol: -1 } },
  'min': { f: 60, d: { time: 1 } },
  'h': { f: 3600, d: { time: 1 } },
  '°C': { f: 1, d: { temp: 1 } },
};
const VALUE_UNITS = Object.keys(UNITS);
const FORMULA_UNITS = ['auto', ...VALUE_UNITS.filter(u => u !== '°C')];
const LITERAL_UNITS = VALUE_UNITS.filter(u => u && u !== '1:N' && u !== 'x').sort((a, b) => b.length - a.length);
const AUTO_UNITS = {
  'vol:1': ['L', 'mL', 'µL', 'nL'],
  'mass:1': ['mg', 'µg', 'ng', 'pg'],
  'mass:1|vol:-1': ['mg/mL', 'µg/mL', 'ng/mL', 'pg/mL'],
  'mol:1|vol:-1': ['mM', 'µM', 'nM'],
  'time:1': ['h', 'min'],
  'cell:1': ['cells'],
  'cell:1|vol:-1': ['cells/mL'],
};
const DIM_WORDS = {
  '': 'plain number', 'vol:1': 'volume', 'cell:1': 'cell count', 'cell:1|vol:-1': 'cell concentration',
  'mass:1': 'mass', 'mass:1|vol:-1': 'concentration', 'mol:1|vol:-1': 'molarity', 'time:1': 'time', 'temp:1': 'temperature',
};
const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

class CalcError extends Error {
  constructor(message, extra = {}) { super(message); this.extra = extra; }
}

function fmt(x) {
  if (!Number.isFinite(x)) return '?';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e5 || a < 1e-3) return x.toExponential(2).replace('e+', 'E+').replace('e-', 'E-');
  if (Number.isInteger(x)) return String(x);
  return String(parseFloat(x.toPrecision(3)));
}

function parseNumber(text) {
  const m = /^\s*([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)\s*([kKM])?\s*$/.exec(String(text ?? ''));
  return m ? parseFloat(m[1]) * ({ k: 1e3, K: 1e3, M: 1e6 }[m[2]] ?? 1) : NaN;
}

const dimKey = d => Object.entries(d).filter(([, p]) => p).sort(([a], [b]) => a.localeCompare(b)).map(([k, p]) => `${k}:${p}`).join('|');
const dimWords = d => DIM_WORDS[dimKey(d)] ?? `mixed unit (${dimKey(d).replace(/\|/g, ' · ')})`;

function combine(a, b, sign) {
  const out = { ...a };
  for (const [k, p] of Object.entries(b)) out[k] = (out[k] ?? 0) + sign * p;
  for (const k of Object.keys(out)) if (!out[k]) delete out[k];
  return out;
}

function autoText(q) {
  const key = dimKey(q.d);
  const candidates = AUTO_UNITS[key];
  if (!candidates) return key ? `${fmt(q.v)} (${dimWords(q.d)})` : fmt(q.v);
  const unit = q.v === 0 ? candidates[Math.min(1, candidates.length - 1)] : candidates.find(c => Math.abs(q.v) / UNITS[c].f >= 1) ?? candidates[candidates.length - 1];
  return `${fmt(q.v / UNITS[unit].f)} ${unit}`;
}

function formatIn(q, unit) {
  if (!unit || unit === 'auto') return { text: autoText(q) };
  const u = UNITS[unit];
  if (dimKey(u.d) !== dimKey(q.d)) return { error: `Works out to a ${dimWords(q.d)} (${autoText(q)}), not ${unit === '' ? 'a plain number' : unit}` };
  if (u.ratio) return { text: `1:${fmt(1 / q.v)}` };
  if (unit === 'x') return { text: `${fmt(q.v)}×` };
  return { text: unit ? `${fmt(q.v / u.f)} ${unit}` : fmt(q.v) };
}

function tokenize(source, names) {
  const s = source.replace(/−/g, '-').replace(/[×·]/g, '*').replace(/÷/g, '/').replace(/(\d\s*)u(L|g|M)\b/g, '$1µ$2');
  const sorted = [...names].sort((a, b) => b.length - a.length);
  const isWordChar = c => /[A-Za-z0-9_µ°]/.test(c ?? '');
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if ('+-*/()'.includes(c)) { tokens.push({ t: 'op', v: c }); i++; continue; }
    const rest = s.slice(i);
    const num = /^(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?/.exec(rest);
    if (num) {
      i += num[0].length;
      let j = i;
      while (s[j] === ' ') j++;
      const unit = LITERAL_UNITS.find(u => s.startsWith(u, j) && !isWordChar(s[j + u.length])) ?? '';
      if (unit) i = j + unit.length;
      tokens.push({ t: 'num', v: parseFloat(num[0]), unit });
      continue;
    }
    const fn = /^(ceil|round|floor)\s*(?=\()/i.exec(rest);
    if (fn) { tokens.push({ t: 'fn', v: fn[1].toLowerCase() }); i += fn[0].length; continue; }
    const name = sorted.find(n => rest.slice(0, n.length).toLowerCase() === n.toLowerCase() && !isWordChar(rest[n.length]));
    if (name) { tokens.push({ t: 'name', v: name }); i += name.length; continue; }
    const unknown = /^[^+\-*/()]+/.exec(rest)[0];
    tokens.push({ t: 'unknown', v: unknown.trim() });
    i += unknown.length;
  }
  return tokens;
}

function parse(tokens) {
  let i = 0;
  const isOp = v => tokens[i]?.t === 'op' && tokens[i].v === v;
  const expect = v => { if (!isOp(v)) throw new CalcError(`Missing ‘${v}’`); i++; };
  const expr = () => {
    let n = term();
    while (isOp('+') || isOp('-')) { const op = tokens[i++].v; n = { k: 'bin', op, a: n, b: term() }; }
    return n;
  };
  const term = () => {
    let n = factor();
    while (isOp('*') || isOp('/')) { const op = tokens[i++].v; n = { k: 'bin', op, a: n, b: factor() }; }
    return n;
  };
  const factor = () => {
    if (isOp('-')) { i++; return { k: 'neg', a: factor() }; }
    return primary();
  };
  const primary = () => {
    const t = tokens[i++];
    if (!t) throw new CalcError('The formula stops too early');
    if (t.t === 'num') return { k: 'num', v: t.v, unit: t.unit };
    if (t.t === 'name') return { k: 'ref', name: t.v };
    if (t.t === 'unknown') throw new CalcError(`‘${t.v}’ isn't a value or formula on this board`, { missing: t.v });
    if (t.t === 'fn') { expect('('); const a = expr(); expect(')'); return { k: 'fn', name: t.v, a }; }
    if (t.t === 'op' && t.v === '(') { const a = expr(); expect(')'); return { k: 'par', a }; }
    throw new CalcError(`Unexpected ‘${SYM[t.v] ?? t.v}’`);
  };
  if (!tokens.length) throw new CalcError('Empty formula');
  const tree = expr();
  if (i < tokens.length) throw new CalcError(`Unexpected ‘${SYM[tokens[i].v] ?? tokens[i].v}’`);
  return tree;
}

const effectiveValue = it => {
  if (state.mode !== 'run') return it.value;
  if (it.id in state.run.overrides) return state.run.overrides[it.id];
  return it.perRun ? '' : it.value;
};

function displayOf(it, raw) {
  const text = String(raw ?? '').trim();
  if (it.unit === '1:N') return `1:${text}`;
  if (it.unit === 'x') return `${text}×`;
  return it.unit ? `${text} ${it.unit}` : text;
}

function valueQuantity(it) {
  const n = parseNumber(effectiveValue(it));
  if (Number.isNaN(n)) return null;
  const u = UNITS[it.unit] ?? UNITS[''];
  if (u.ratio) return n > 0 ? { v: 1 / n, d: {} } : null;
  return { v: n * u.f, d: u.d };
}

let calc = { names: new Map(), results: new Map(), dupes: new Set() };

function recompute() {
  const names = new Map();
  const dupes = new Set();
  const results = new Map();
  const define = (name, entry) => {
    const key = String(name ?? '').trim().toLowerCase();
    if (!key) return;
    if (names.has(key)) { dupes.add(entry.id); return; }
    names.set(key, { ...entry, name: name.trim() });
  };
  const formulas = [];
  for (const b of state.blocks) {
    if (b.type === 'list' && b.named) b.items.forEach(row => {
      const rowName = String(row.cells[b.columns[0].id] ?? '').trim();
      if (!rowName) return;
      const firstNumber = b.columns.find(c => c.kind === 'number');
      define(rowName, { kind: 'item', id: row.id, groupTitle: b.title, hint: firstNumber ? `${rowName} ${firstNumber.name.toLowerCase()}` : '', label: () => itemLabel({ list: b, item: row }) });
      b.columns.filter(c => c.kind === 'number').forEach(c => {
        const id = `${row.id}:${c.id}`;
        const unit = c.unit === '*' ? (row.units?.[c.id] ?? '') : c.unit;
        define(`${rowName} ${c.name.trim().toLowerCase()}`, { kind: 'value', id, item: { id, value: row.cells[c.id] ?? '', unit, perRun: c.perRun } });
      });
    });
    if (b.type === 'materials') b.items.filter(item => item.name.trim()).forEach(item => {
      const numbers = materialFields(b, item).filter(f => f.kind === 'number' && item.on.includes(f.key));
      define(item.name, { kind: 'item', id: item.id, groupTitle: materialGroup(b, item.group).label, hint: numbers[0] ? fieldName(item, numbers[0]) : '', label: () => materialLabel(item) });
      numbers.forEach(f => {
        const id = `${item.id}:${f.key}`;
        define(fieldName(item, f), { kind: 'value', id, item: { id, value: item.values[f.key] ?? '', unit: fieldUnit(item, f), perRun: f.scope !== 'protocol' } });
      });
    });
    if (b.type === 'values') b.items.forEach(it => define(it.name, { kind: 'value', id: it.id, item: it }));
    if (b.type === 'plate') vesselCounts(b).forEach(([name, n]) => define(name, { kind: 'plate', id: `${b.id}:${name}`, q: { v: n, d: {} }, display: String(n) }));
    if (b.type === 'formula') b.items.forEach(it => { formulas.push(it); define(it.name, { kind: 'formula', id: it.id, item: it }); });
  }
  const nameList = [...names.values()].map(e => e.name);
  const inProgress = [];

  const resolve = name => {
    const e = names.get(name.toLowerCase());
    if (e.kind === 'value') {
      const q = valueQuantity(e.item);
      if (!q) throw new CalcError(e.item.perRun && state.mode === 'run' ? `Waiting for ${e.name}, recorded on the run` : `${e.name} has no number yet`);
      return { q, html: `<span class="r-value">${esc(displayOf(e.item, effectiveValue(e.item)))}</span>` };
    }
    if (e.kind === 'plate') return { q: e.q, html: `<span class="r-plate">${e.display}</span>` };
    if (e.kind === 'item') throw new CalcError(`${e.name} is in ${e.groupTitle}, not a number.${e.hint ? ` Use one of its numbers, like ${e.hint}.` : ''}`);
    const r = evaluate(e.item);
    if (r.error) throw new CalcError(r.cycle ? r.error : `Needs ${e.name}, which can't be worked out yet`, { cycle: r.cycle });
    return { q: r.q, html: `<span class="r-formula">${esc(r.out.error ? autoText(r.q) : r.out.text)}</span>` };
  };

  const run = n => {
    if (n.k === 'num') {
      const u = UNITS[n.unit];
      return { q: { v: n.v * u.f, d: u.d }, html: esc(fmt(n.v) + (n.unit ? ` ${n.unit}` : '')) };
    }
    if (n.k === 'ref') return resolve(n.name);
    if (n.k === 'par') { const a = run(n.a); return { q: a.q, html: `(${a.html})` }; }
    if (n.k === 'neg') { const a = run(n.a); return { q: { v: -a.q.v, d: a.q.d }, html: `−${a.html}` }; }
    if (n.k === 'fn') {
      const a = run(n.a);
      if (!['', 'cell:1'].includes(dimKey(a.q.d))) throw new CalcError(`${n.name}() rounds counts, not a ${dimWords(a.q.d)}`);
      return { q: { v: Math[n.name](a.q.v), d: a.q.d }, html: `${n.name}(${a.html})` };
    }
    const a = run(n.a);
    const b = run(n.b);
    const html = `${a.html} ${SYM[n.op]} ${b.html}`;
    if (n.op === '+' || n.op === '-') {
      if (dimKey(a.q.d) !== dimKey(b.q.d)) {
        throw new CalcError(n.op === '+' ? `Can't add a ${dimWords(b.q.d)} to a ${dimWords(a.q.d)}` : `Can't subtract a ${dimWords(b.q.d)} from a ${dimWords(a.q.d)}`);
      }
      return { q: { v: n.op === '+' ? a.q.v + b.q.v : a.q.v - b.q.v, d: a.q.d }, html };
    }
    if (n.op === '/' && b.q.v === 0) throw new CalcError('Divides by zero');
    return { q: { v: n.op === '*' ? a.q.v * b.q.v : a.q.v / b.q.v, d: combine(a.q.d, b.q.d, n.op === '*' ? 1 : -1) }, html };
  };

  const evaluate = it => {
    if (results.has(it.id)) return results.get(it.id);
    if (inProgress.includes(it.id)) {
      const path = inProgress.slice(inProgress.indexOf(it.id)).map(id => formulas.find(f => f.id === id).name.trim());
      throw new CalcError(`Goes in a circle: ${[...path, it.name.trim()].join(' → ')}`, { cycle: true });
    }
    inProgress.push(it.id);
    let r;
    try {
      if (dupes.has(it.id)) throw new CalcError('Another value or formula already has this name');
      if (!it.expr.trim()) {
        r = { empty: true, error: 'Type a formula using the names on this board' };
      } else {
        const tree = parse(tokenize(it.expr, nameList));
        const { q, html } = run(tree);
        r = { q, html, showWork: !['num', 'ref'].includes(tree.k), out: formatIn(q, it.unit) };
      }
    } catch (e) {
      if (!(e instanceof CalcError)) throw e;
      r = { error: e.message, missing: e.extra.missing, cycle: e.extra.cycle };
    }
    inProgress.pop();
    results.set(it.id, r);
    return r;
  };

  formulas.forEach(evaluate);
  calc = { names, results, dupes };
}

function refInfo(name) {
  const e = calc.names.get(name.trim().toLowerCase());

    const text = templateText(s.text) || '(empty step)';
    const isCur = run && (s.id === cur || n.subs.some(x => x.id === cur));
    const cls = ['fb', side ? 'side' : '', run && state.run.done[s.id] ? 'done' : '', isCur ? 'cur' : ''].join(' ');
    const lines = wrap(text, 26, Math.max(1, 3 - (n.subs.length ? 1 : 0)));
    const subsDone = n.subs.filter(x => state.run.done[x.id]).length;
    const subLine = n.subs.length ? `<text class="sb" x="${x + 10}" y="${y + 18 + lines.length * 15}">+ ${n.subs.length} sub-step${n.subs.length === 1 ? '' : 's'}${run ? `, ${subsDone} done` : ''}</text>` : '';
    const tip = [text, ...n.subs.map(x => `${nums[x.id]} ${templateText(x.text)}`)].join('\n');
    return `<g class="${cls}" data-step="${s.id}"><title>${esc(tip)}</title><rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="4"/>${lines.map((l, i) => `<text class="tx" x="${x + 10}" y="${y + 18 + i * 15}">${i === 0 ? `<tspan class="nm">${n.num}</tspan> ` : ''}${esc(l)}</text>`).join('')}${subLine}</g>`;
  };
  const parts = [];
  let y = 6;
  for (let start = 0; start < mains.length; start += perRow) {
    const row = mains.slice(start, start + perRow);
    const top = y + LABEL;
    const depth = Math.max(0, ...row.map(n => n.sides.length));
    row.forEach((n, ci) => {
      const x = PAD + ci * (BW + GX);
      if (n.section) parts.push(`<text class="fl-sec" x="${x}" y="${top - 8}">${esc(n.section)}</text>`);
      if (ci > 0) parts.push(`<line class="fl-arrow" x1="${x - GX + 2}" y1="${top + BH / 2}" x2="${x - 4}" y2="${top + BH / 2}" marker-end="url(#${marker})"/>`);
      parts.push(box(n, x, top, false));
      n.sides.forEach((side, k) => {
        const sy = top + BH + SIDE_GAP + k * (BH + 12);
        if (k === 0) parts.push(`<path class="fl-mw" d="M${x + BW / 2} ${top + BH} V${sy}"/><text class="fl-mwl" x="${x + BW / 2 + 6}" y="${top + BH + SIDE_GAP / 2 + 3}">MEANWHILE</text>`);
        parts.push(box(side, x, sy, true));
      });
    });
    const bottom = top + BH + (depth ? SIDE_GAP + depth * (BH + 12) - 12 : 0);
    if (start + perRow < mains.length) {
      const lastX = PAD + (row.length - 1) * (BW + GX);
      const midY = bottom + ROW_GAP / 2;
      const nextTop = bottom + ROW_GAP + LABEL;
      parts.push(`<path class="fl-arrow" d="M${lastX + BW} ${top + BH / 2} h${GX / 2 - 4} V${midY} H${PAD + BW / 2} V${nextTop - 4}" marker-end="url(#${marker})"/>`);
    }
    y = bottom + ROW_GAP;
  }
  return `<svg width="${width}" height="${y - ROW_GAP + 12}"><defs><marker id="${marker}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fl-head" d="M0 0L10 5L0 10z"/></marker></defs>${parts.join('')}</svg>`;
}

function stepBlockEnd(i) {
  const s = state.steps[i];
  const belongs = x => (s.kind === 'section' ? x.kind !== 'section' : s.level !== 2 && x.kind === 'step' && x.level === 2);
  let end = i + 1;
  while (end < state.steps.length && belongs(state.steps[end])) end++;
  return end;
}

function moveStepBlock(id, targetId, after) {
  const from = state.steps.findIndex(s => s.id === id);
  const moving = state.steps[from];
  const block = state.steps.splice(from, stepBlockEnd(from) - from);
  if (block.some(s => s.id === targetId)) { state.steps.splice(from, 0, ...block); return; }
  let to = state.steps.findIndex(s => s.id === targetId);
  if (after) to = state.steps[to].kind === 'section' && moving.kind !== 'section' ? to + 1 : stepBlockEnd(to);
  state.steps.splice(to, 0, ...block);
}

const sameRank = (other, s) => (s.kind === 'section' ? other.kind === 'section' : s.level === 2 || other.kind === 'section' || other.level !== 2);

function moveStepUp(i) {
  const s = state.steps[i];
  for (let j = i - 1; j >= 0; j--) if (sameRank(state.steps[j], s)) { moveStepBlock(s.id, state.steps[j].id, false); return; }
}

function moveStepDown(i) {
  const s = state.steps[i];
  for (let j = stepBlockEnd(i); j < state.steps.length; j++) if (sameRank(state.steps[j], s)) { moveStepBlock(s.id, state.steps[j].id, true); return; }
}

function insertPreset(editor, preset) {
  const selection = getSelection();
  let range = selection.rangeCount && editor.contains(selection.getRangeAt(0).startContainer) ? selection.getRangeAt(0) : null;
  if (!range) { range = document.createRange(); range.selectNodeContents(editor); range.collapse(false); }
  range.deleteContents();
  const fragment = document.createDocumentFragment();
  const lead = editor.textContent.trim() && !/\s$/.test(editor.textContent) ? ' ' : '';
  preset.text.split(/(‹[^›]*›)/).forEach((part, i) => {
    if (!part) return;
    const slot = /^‹(.*)›$/.exec(part);
    if (!slot) { fragment.append(document.createTextNode(i === 0 ? lead + part : part)); return; }
    const span = document.createElement('span');
    span.className = 'slot';
    span.textContent = slot[1];
    fragment.append(span);
  });
  range.insertNode(fragment);
  const first = editor.querySelector('.slot');
  if (first) { const r = document.createRange(); r.selectNodeContents(first); selection.removeAllRanges(); selection.addRange(r); }
  editor.dispatchEvent(new Event('input', { bubbles: true }));
}

function jumpToSlot(editor, backwards) {
  const slots = [...editor.querySelectorAll('.slot')];
  if (!slots.length) return false;
  const selection = getSelection();
  const caret = selection.rangeCount ? selection.getRangeAt(0) : null;
  const inside = slot => caret && slot.contains(caret.startContainer);
  const ahead = slots.filter(slot => !inside(slot) && (!caret || caret.comparePoint(slot, 0) === 1));
  const behind = slots.filter(slot => !inside(slot) && caret && caret.comparePoint(slot, 0) === -1);
  const next = backwards ? behind[behind.length - 1] ?? slots[slots.length - 1] : ahead[0] ?? slots[0];
  const r = document.createRange();
  r.selectNodeContents(next);
  selection.removeAllRanges();
  selection.addRange(r);
  return true;
}

function caretRangeAt(x, y) {
  if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
  const position = document.caretPositionFromPoint?.(x, y);
  if (!position) return null;
  const range = document.createRange();
  range.setStart(position.offsetNode, position.offset);
  return range;
}

function parseProtocolText(raw) {
  const lines = raw.replace(/\r/g, '').replace(/(\w)-\n(\w)/g, '$1$2').split('\n').map(l => l.replace(/\s+/g, ' ').trim());
  const ROMAN_HEAD = /^([IVX]+)[.)]\s+(.+)$/;
  const WORD_HEAD = /^(day|part|section|stage|phase)\s+\d+\b.*$/i;
  const NUMBERED = /^(?:step\s*)?\d{1,3}(?:[.)]\s+|\s*:\s*)(.+)$/i;
  const LETTERED = /^\(?[a-h][.)]\s+(.+)$/;
  const SMALL_ROMAN = /^\(?(?:i{1,3}|iv|vi{0,3}|ix|x)[.)]\s+(.+)$/;
  const BULLET = /^[•·▪●◦*\-–—]\s+(.+)$/;
  const NOTE = /^(note|caution|important|tip)\s*[:\-–]\s*(.+)$/i;
  const numbered = lines.some(l => NUMBERED.test(l));
  const out = [];
  let current = null;
  let gap = false;
  let bulletLevel = 0;
  const push = item => { out.push(item); current = item; };
  for (const line of lines) {
    if (!line) { gap = true; continue; }
    const headingShaped = line.length <= 60 && !/[.!?]$/.test(line);
    const shouting = /[A-Z]{3}/.test(line) && line === line.toUpperCase();
    let m;
    if ((m = ROMAN_HEAD.exec(line)) && !SMALL_ROMAN.test(line)) push({ kind: 'section', text: m[2] });
    else if (WORD_HEAD.test(line) && headingShaped) push({ kind: 'section', text: line.replace(/:$/, '') });
    else if (headingShaped && (/:$/.test(line) || shouting) && !NUMBERED.test(line)) push({ kind: 'section', text: line.replace(/:$/, '') });
    else if ((m = NUMBERED.exec(line))) push({ kind: 'step', level: 1, text: m[1] });
    else if ((m = SMALL_ROMAN.exec(line)) && current?.kind === 'step') push({ kind: 'step', level: 2, text: m[1] });
    else if ((m = LETTERED.exec(line))) push({ kind: 'step', level: 2, text: m[1] });
    else if ((m = BULLET.exec(line))) { bulletLevel = bulletLevel || (current?.kind === 'step' ? 2 : 1); push({ kind: 'step', level: bulletLevel, text: m[1] }); gap = false; continue; }
    else if ((m = NOTE.exec(line)) && current?.kind === 'step') current.text += ` ${m[1][0].toUpperCase()}${m[1].slice(1).toLowerCase()}: ${m[2]}`;
    else if (current?.kind === 'step' && (numbered || (!gap && !bulletLevel))) current.text += ` ${line}`;
    else push({ kind: 'step', level: 1, text: line });
    gap = false;
    bulletLevel = 0;
  }
  return out.map(item => ({ ...item, text: item.text.trim(), ...(item.kind === 'step' ? { meanwhile: false } : {}) }));
}

const sketchTools = new Map();
const sketchTool = b => { if (!sketchTools.has(b.id)) sketchTools.set(b.id, { color: SKETCH_COLORS[0], mode: 'pen' }); return sketchTools.get(b.id); };
function drawSketch(b, canvas) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const scale = canvas.clientWidth / SKETCH_WIDTH;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  for (const s of b.strokes) {
    if (s.kind === 'text') {
      ctx.fillStyle = s.color;
      ctx.font = `${s.size}px "Segoe Print", "Comic Sans MS", cursive`;
      ctx.fillText(s.text, s.x, s.y);
      continue;
    }
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.7 / scale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    s.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
  }
  if (!b.strokes.length) {
    ctx.fillStyle = 'rgba(200,195,180,.35)';
    ctx.font = 'italic 52px "Hanken Grotesk", sans-serif';
    ctx.fillText('Draw here', 40, 110);
  }
}

function materialControl(item, f) {
  const run = isRun();
  const perRun = f.scope !== 'protocol';
  const value = run ? effectiveValue({ id: `${item.id}:${f.key}`, value: item.values[f.key] ?? '', perRun }) : item.values[f.key] ?? '';
  const placeholder = !run && perRun ? (f.scope === 'lot' ? 'per lot' : 'each run') : '';
  const cls = `in mfield${f.kind === 'number' ? ' mono' : ''}`;
  const control = f.kind === 'choice'
    ? `<select class="${cls}" data-key="${f.key}">${['', ...f.options].map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
    : `<input class="${cls}" data-key="${f.key}"${f.kind === 'date' ? ' type="date"' : ''} value="${esc(value)}" placeholder="${placeholder}" spellcheck="false" />`;

    ? `<select class="in munit" data-unitkey="${f.key}">${(f.units ?? VALUE_UNITS).map(u => `<option value="${esc(u)}"${u === unit ? ' selected' : ''}>${esc(u || 'none')}</option>`).join('')}</select>`
    : `<span class="unit">${esc(shortUnit(unit))}</span>`;
  return `<span class="ramt">${unit === '1:N' ? '<span class="pre">1:</span>' : ''}${control}${unitControl}</span>`;
}

function materialText(item, f) {
  const perRun = f.scope !== 'protocol';

}

function materialCell(item, f) {

}

function materialEditor(b, item) {
  const run = isRun();
  const fields = materialFields(b, item);
  const boxes = fields.filter(f => item.on.includes(f.key)).map(f => `<div class="mf"><span class="mf-l">${esc(f.label)}${scopeTag(f)}${run ? '' : `<button class="mf-x" data-act="off" data-key="${f.key}" title="Remove this field">×</button>`}</span>${materialControl(item, f)}</div>`).join('');
  const name = run ? `<span class="me-name">${esc(item.name)}</span>` : `<input class="in lname me-name" value="${esc(item.name)}" placeholder="Name" spellcheck="false" />`;
  const chips = run ? '' : `<div class="mc-more"><span class="mc-more-l">Add a field</span>${fields.filter(f => !item.on.includes(f.key)).map(f => `<button class="fchip" data-act="on" data-key="${f.key}">${esc(f.label)}</button>`).join('')}<button class="fchip custom" data-act="custom">Your own field</button></div>`;

}

function materialSection(b, items) {
  const columns = [];
  for (const item of items) for (const f of materialFields(b, item)) if (item.on.includes(f.key) && !columns.some(c => c.key === f.key)) columns.push(f);
  const open = openMaterials.get(b.id);
  const rows = items.map((item, i) => {
    const fields = materialFields(b, item);
    const cells = columns.map(c => {
      const f = fields.find(x => x.key === c.key);
      return `<td>${f && item.on.includes(f.key) ? materialCell(item, f) : ''}</td>`;
    }).join('');
    const isOpen = open === item.id;
    const row = `<tr class="mrow${i % 2 ? ' alt' : ''}${isOpen ? ' open' : ''}" data-item="${item.id}" data-act="open" data-pick="${esc(item.name)}"><td class="mname">${esc(item.name) || '<span class="hint">Unnamed</span>'}</td><td class="mtype">${esc(item.type)}</td>${cells}</tr>`;
    return isOpen ? `${row}<tr class="medit-row"><td colspan="${columns.length + 2}">${materialEditor(b, item)}</td></tr>` : row;
  }).join('');
  return `<div class="mtable-wrap"><table class="mtab"><thead><tr><th>Name</th><th>Type</th>${columns.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rememberLotValue(item, key, value) {
  const lot = String(state.run.overrides[`${item.id}:lot`] ?? '').trim();
  if (lot) ((state.lotMemory[item.id] ??= {})[lot] ??= {})[key] = value;
}

function fillFromLotMemory(item) {
  const lot = String(state.run.overrides[`${item.id}:lot`] ?? '').trim();
  const remembered = state.lotMemory[item.id]?.[lot];
  if (!remembered) return false;
  let filled = false;
  for (const [key, value] of Object.entries(remembered)) {
    const id = `${item.id}:${key}`;
    if (String(state.run.overrides[id] ?? '').trim()) continue;
    state.run.overrides[id] = value;
    if (!item.on.includes(key)) item.on.push(key);
    filled = true;
  }
  return filled;
}

const TYPES = {

    make: () => ({ title: 'Materials', folded: [], customGroups: [], items: [] }),
    render(b, body) {

      const addGroup = groups.find(g => g.key === add.group) ?? groups[0];
      const types = [...Object.keys(addGroup.types), 'Other'];
      const adder = `<div class="mtools"><select class="in madd-group">${groups.map(g => `<option value="${esc(g.key)}"${g.key === addGroup.key ? ' selected' : ''}>${esc(g.label)}</option>`).join('')}<option value="__new">New group…</option></select><select class="in madd-type">${types.map(t => `<option${t === add.type ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select><input class="in madd-name" placeholder="Name, e.g. anti-CD4" spellcheck="false" /><button class="add primary" data-act="add"><span class="plus">+</span>Add Material</button></div>`;
      const sections = groups.map(g => ({ g, items: b.items.filter(i => i.group === g.key) })).filter(s => s.items.length);
      body.innerHTML = (run ? '' : adder) + (sections.length ? sections.map(({ g, items }) => {
        const folded = b.folded.includes(g.key);
        return `<section class="msec${folded ? ' folded' : ''}" data-group="${esc(g.key)}"><div class="msec-head" data-act="fold-group"><span class="arrow">${folded ? '▸' : '▾'}</span><span class="msec-title">${esc(g.label)}</span><span class="msec-count">${items.length}</span><span class="msec-line"></span></div>${folded ? '' : `<div class="msec-body">${materialSection(b, items)}</div>`}</section>`;
      }).join('') : '<p class="hint">Nothing yet. Pick a group and type above and add the first material.</p>');
    },
    update(b, body) {
      const run = isRun();
      body.querySelectorAll('tr.mrow[data-item], .medit[data-item]').forEach(el => {
        const item = b.items.find(i => i.id === el.dataset.item);
        if (!item) return;
        el.querySelector('.lname')?.classList.toggle('bad', calc.dupes.has(item.id));
        if (!run) return;
        const fields = materialFields(b, item);
        el.querySelectorAll('.mfield').forEach(input => {
          const f = fields.find(x => x.key === input.dataset.key);
          const id = `${item.id}:${f.key}`;
          const changed = f.scope === 'protocol' && id in state.run.overrides;
          input.classList.toggle('changed', changed);
          input.classList.toggle('need', f.scope !== 'protocol' && !String(input.value).trim());
          input.classList.toggle('expired', f.kind === 'date' && !!f.warnPast && !!input.value && input.value < TODAY_ISO);
          input.title = changed ? `Protocol says ${item.values[f.key] || 'nothing'}` : '';
        });
      });
    },
    onInput(b, e) {
      const el = e.target;
      const item = b.items.find(i => i.id === el.closest('[data-item]')?.dataset.item);
      if (!item) return;
      if (el.matches('.lname')) item.name = el.value;
      else if (el.dataset.unitkey) item.units[el.dataset.unitkey] = el.value;
      else if (el.matches('.mfield')) {
        const f = materialFields(b, item).find(x => x.key === el.dataset.key);
        const id = `${item.id}:${f.key}`;
        if (!isRun()) item.values[f.key] = el.value;
        else if (f.scope === 'protocol' && el.value === (item.values[f.key] ?? '')) delete state.run.overrides[id];
        else state.run.overrides[id] = el.value;
        if (isRun() && f.scope === 'lot') rememberLotValue(item, f.key, el.value);
        bodyOf(b).querySelectorAll(`[data-item="${item.id}"] .mfield[data-key="${f.key}"]`).forEach(twin => { if (twin !== el) twin.value = el.value; });
      } else return;

    },
    onChange(b, e) {
      const el = e.target;
      if (el.matches('.madd-group')) {
        if (el.value === '__new') {
          const label = prompt('Name of the new group')?.trim();
          if (label && !materialGroupsOf(b).some(g => g.label.toLowerCase() === label.toLowerCase())) b.customGroups.push(label);
          const group = materialGroupsOf(b).find(g => g.label.toLowerCase() === (label ?? '').toLowerCase());

          save();

        renderBlock(b);

      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act || (act === 'open' && (isPicking() || e.target.closest('input, select, button')))) return;
      const item = b.items.find(i => i.id === e.target.closest('[data-item]')?.dataset.item);
      const key = e.target.closest('[data-key]')?.dataset.key;
      let added = null;
      if (act === 'open') openMaterials.set(b.id, openMaterials.get(b.id) === item.id ? null : item.id);
      else if (act === 'close') openMaterials.delete(b.id);
      else if (act === 'fold-group') {
        const group = e.target.closest('[data-group]').dataset.group;
        b.folded = b.folded.includes(group) ? b.folded.filter(g => g !== group) : [...b.folded, group];
      } else if (act === 'add') {
        const add = materialAddState.get(b.id) ?? { group: 'ab', type: 'Antibody' };
        added = newMaterial(add.group, add.type, bodyOf(b).querySelector('.madd-name').value.trim());
        b.items.push(added);
        b.folded = b.folded.filter(g => g !== add.group);
        openMaterials.set(b.id, added.id);
      } else if (act === 'del' && item && confirm(`Remove ${item.name || 'this material'}?`)) {
        b.items = b.items.filter(i => i !== item);
        openMaterials.delete(b.id);
      } else if (act === 'on' && item) item.on.push(key);
      else if (act === 'off' && item) item.on = item.on.filter(k => k !== key);
      else if (act === 'custom' && item) {
        const label = prompt('Name of the field')?.trim();
        if (!label) return;
        const f = { key: `custom-${uid()}`, label, kind: 'text', scope: 'protocol', unit: '', options: [] };
        item.custom.push(f);
        item.on.push(f.key);
      } else return;
      renderBlock(b);
      if (added && !added.name) bodyOf(b).querySelector(`.medit[data-item="${added.id}"] .lname`)?.focus();
      save();
      refresh();
    },
  },

  list: {
    label: 'Table', glyph: '▤', hint: 'Your own columns', size: [12, 6],
    make: preset => {
      const p = LIST_PRESETS[preset ?? 'blank'];
      return { title: p.label, named: p.named, columns: p.columns(), items: [] };
    },
    render(b, body) {
      const run = isRun();
      const nameColumn = b.columns[0];
      const columns = b.columns.filter(c => c === nameColumn || !c.hidden);
      const editing = !run && openColumnEditors.has(b.id);
      const open = openRows.get(b.id);
      const unitOf = (row, c) => (c.unit === '*' ? (row.units?.[c.id] ?? '') : c.unit);
      const valueOf = (row, c) => (run ? effectiveValue({ id: `${row.id}:${c.id}`, value: row.cells[c.id] ?? '', perRun: c.perRun }) : row.cells[c.id] ?? '');
      const control = (row, c) => {
        const value = valueOf(row, c);
        const cls = ['in', c.kind === 'number' ? 'mono' : '', c === nameColumn ? 'lname' : ''].filter(Boolean).join(' ');
        const input = c.kind === 'choice'
          ? `<select class="${cls}" data-col="${c.id}">${['', ...c.options].map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
          : `<input class="${cls}" data-col="${c.id}"${c.kind === 'date' ? ' type="date"' : ''} value="${esc(value)}" placeholder="${!run && c.perRun ? 'each run' : ''}" spellcheck="false" />`;
        if (c.kind !== 'number') return input;
        const unit = unitOf(row, c);
        const unitControl = c.unit === '*' && !run
          ? `<select class="in lunit" data-unitcol="${c.id}">${VALUE_UNITS.map(u => `<option value="${esc(u)}"${u === unit ? ' selected' : ''}>${esc(u || 'none')}</option>`).join('')}</select>`
          : `<span class="unit">${esc(shortUnit(unit))}</span>`;
        return `<span class="ramt">${unit === '1:N' ? '<span class="pre">1:</span>' : ''}${input}${unitControl}</span>`;
      };
      const text = (row, c) => {
        const raw = valueOf(row, c);
        if (String(raw).trim()) return esc(displayOf({ unit: c.kind === 'number' ? unitOf(row, c) : '' }, raw));
        return c.perRun && !run ? '<span class="mpending">each run</span>' : '';
      };
      const head = columns.map(c => `<th>${esc(c.name)}</th>`).join('');
      const rows = b.items.map((row, i) => {
        const isOpen = row.id === open;
        const cells = columns.map(c => `<td>${isOpen || (run && c.perRun) ? control(row, c) : text(row, c)}</td>`).join('');
        const tools = isOpen ? `<span class="mrow-tools">${run ? '' : '<button class="lnk" data-act="del-row">Remove</button>'}<button class="lnk" data-act="close">Done</button></span>` : '';
        const pick = b.named ? ` data-pick="${esc(row.cells[nameColumn.id] ?? '')}"` : '';
        return `<tr class="mrow${i % 2 ? ' alt' : ''}${isOpen ? ' open' : ''}" data-item="${row.id}" data-act="open"${pick}>${cells}<td>${tools}</td></tr>`;
      }).join('');
      const hiddenCount = b.columns.filter(c => c.hidden).length;
      const tools = run ? '' : `<div class="ltools"><button class="lnk${editing ? ' on' : ''}" data-act="columns">Columns${hiddenCount ? ` · ${hiddenCount} hidden` : ''}</button><label><input type="checkbox" class="lnamed"${b.named ? ' checked' : ''} /> use rows in steps and formulas</label></div>`;
      body.innerHTML = `${tools}${editing ? this.columnEditor(b) : ''}<div class="mtable-wrap"><table class="mtab"><thead><tr>${head}<th></th></tr></thead><tbody>${rows}</tbody></table></div>${run ? '' : '<button class="add" data-act="add-row">+ Row</button>'}`;
    },
    columnEditor(b) {
      const option = (value, selected, label = value) => `<option value="${esc(value)}"${value === selected ? ' selected' : ''}>${esc(label)}</option>`;
      return `<div class="coledit">${b.columns.map((c, i) => {
        const kind = i === 0 ? '<span class="cfixed">row name</span>' : `<select class="in ckind">${COLUMN_KINDS.map(k => option(k, c.kind)).join('')}</select>`;
        const detail = c.kind === 'number'
          ? `<select class="in cunit">${COLUMN_UNITS.map(u => option(u, c.unit, u === '*' ? 'unit per row' : u || 'no unit')).join('')}</select>`
          : c.kind === 'choice' ? `<input class="in copts" value="${esc(c.options.join(', '))}" placeholder="options, comma separated" />` : '<span></span>';
        const flags = i === 0 ? '<span></span><span></span><span></span>'
          : `<label><input type="checkbox" class="crun"${c.perRun ? ' checked' : ''} /> each run</label><label><input type="checkbox" class="chide"${c.hidden ? ' checked' : ''} /> hide</label>${c.kind === 'date' ? `<label><input type="checkbox" class="cwarn"${c.warnPast ? ' checked' : ''} /> flag if past</label>` : '<span></span>'}`;
        const moves = `${i > 1 ? '<button data-act="col-left" title="Move left">←</button>' : ''}${i > 0 && i < b.columns.length - 1 ? '<button data-act="col-right" title="Move right">→</button>' : ''}${i > 0 ? '<button data-act="col-del" title="Remove column">×</button>' : ''}`;
        return `<div class="colrow${c.hidden ? ' hid' : ''}" data-colid="${c.id}"><input class="in cname" value="${esc(c.name)}" spellcheck="false" />${kind}${detail}${flags}<span class="ctools">${moves}</span></div>`;
      }).join('')}<button class="add" data-act="add-col">+ Column</button></div>`;
    },
    update(b, body) {
      const run = isRun();
      for (const row of b.items) {
        const tr = body.querySelector(`[data-item="${row.id}"]`);
        if (!tr) continue;
        tr.querySelector('.lname')?.classList.toggle('bad', b.named && calc.dupes.has(row.id));
        if (!run) continue;
        tr.querySelectorAll('[data-col]').forEach(el => {
          const c = b.columns.find(x => x.id === el.dataset.col);
          const key = `${row.id}:${c.id}`;
          const changed = !c.perRun && key in state.run.overrides;
          el.classList.toggle('changed', changed);
          el.classList.toggle('need', c.perRun && !String(el.value).trim());
          el.classList.toggle('expired', c.kind === 'date' && c.warnPast && !!el.value && el.value < TODAY_ISO);
          el.title = changed ? `Protocol says ${row.cells[c.id] || 'nothing'}` : '';
        });
      }
    },
    onInput(b, e) {
      const el = e.target;
      const row = b.items.find(i => i.id === el.closest('[data-item]')?.dataset.item);
      const column = b.columns.find(c => c.id === el.closest('[data-colid]')?.dataset.colid);
      if (row && el.dataset.col) {
        const c = b.columns.find(x => x.id === el.dataset.col);
        const key = `${row.id}:${c.id}`;
        if (!isRun()) row.cells[c.id] = el.value;
        else if (!c.perRun && el.value === (row.cells[c.id] ?? '')) delete state.run.overrides[key];
        else state.run.overrides[key] = el.value;
      } else if (row && el.dataset.unitcol) {
        (row.units ??= {})[el.dataset.unitcol] = el.value;
      } else if (column && el.matches('.cname')) column.name = el.value;
      else if (column && el.matches('.copts')) column.options = el.value.split(',').map(s => s.trim()).filter(Boolean);
      else return;
      save();
      refresh();
    },
    onChange(b, e) {
      const el = e.target;
      const column = b.columns.find(c => c.id === el.closest('[data-colid]')?.dataset.colid);
      if (el.matches('.lnamed')) b.named = el.checked;
      else if (column && el.matches('.ckind')) column.kind = el.value;
      else if (column && el.matches('.cunit')) column.unit = el.value;
      else if (column && el.matches('.crun')) column.perRun = el.checked;
      else if (column && el.matches('.chide')) column.hidden = el.checked;
      else if (column && el.matches('.cwarn')) column.warnPast = el.checked;
      else if (!el.matches('.cname, .copts, .lunit')) return;
      renderBlock(b);
      save();
      refresh();
    },
    onClick(b, e) {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act || (act === 'open' && (isPicking() || e.target.closest('input, select, button')))) return;
      const rowId = e.target.closest('[data-item]')?.dataset.item;
      const i = b.columns.findIndex(c => c.id === e.target.closest('[data-colid]')?.dataset.colid);
      let added = null;
      if (act === 'open') openRows.set(b.id, rowId);
      else if (act === 'close') openRows.delete(b.id);
      else if (act === 'columns') { if (openColumnEditors.has(b.id)) openColumnEditors.delete(b.id); else openColumnEditors.add(b.id); }
      else if (act === 'add-row') { added = { id: uid(), cells: {}, units: {} }; b.items.push(added); openRows.set(b.id, added.id); }
      else if (act === 'del-row') { b.items = b.items.filter(row => row.id !== rowId); openRows.delete(b.id); }
      else if (act === 'add-col') b.columns.push(newColumn(`Column ${b.columns.length + 1}`));
      else if (act === 'col-left') [b.columns[i - 1], b.columns[i]] = [b.columns[i], b.columns[i - 1]];
      else if (act === 'col-right') [b.columns[i + 1], b.columns[i]] = [b.columns[i], b.columns[i + 1]];
      else if (act === 'col-del' && confirm(`Remove the “${b.columns[i].name}” column and its values?`)) b.columns.splice(i, 1);
      else return;
      renderBlock(b);
      if (act === 'open' || added) bodyOf(b).querySelector('tr.open .in')?.focus();
      save();
      refresh();
    },
  },

  values: {
    label: 'Values', glyph: '#', hint: 'Named numbers you set', size: [3, 6],
    make: () => ({ items: [] }),
    render(b, body) {
      const run = isRun();
      const open = openRows.get(b.id);
      const unitLabel = u => ({ '': 'none', 'x': 'fold ×' }[u] ?? u);

        if (it.id !== open) return `<div class="vrow" data-item="${it.id}" data-act="open" data-pick="${esc(it.name)}"><span class="vn">${esc(it.name) || '<span class="hint">Unnamed</span>'}</span><span class="vv"></span></div>`;
        const pre = it.unit === '1:N' ? '<span class="pre">1:</span>' : '';
        const value = `<span class="ramt">${pre}<input class="in vval mono" value="${esc(effectiveValue(it))}" placeholder="0" />${run ? `<span class="unit">${esc(shortUnit(it.unit))}</span>` : ''}</span>`;
        const fields = run
          ? `<span class="vn">${esc(it.name)}</span>${value}`
          : `<input class="in vname" value="${esc(it.name)}" placeholder="Name" spellcheck="false" />${value}<select class="in vunit">${VALUE_UNITS.map(u => `<option value="${esc(u)}"${u === it.unit ? ' selected' : ''}>${esc(unitLabel(u))}</option>`).join('')}</select>`;
        const reset = run && it.id in state.run.overrides ? `<button class="lnk" data-act="undo">Use protocol value (${esc(displayOf(it, it.value))})</button>` : '';
        return `<div class="vedit" data-item="${it.id}">${fields}<span class="vtools">${reset}${run ? '' : '<button class="lnk" data-act="del">Remove</button>'}<button class="lnk" data-act="close">Done</button></span></div>`;

      for (const it of b.items) {
        const row = body.querySelector(`[data-item="${it.id}"]`);
        if (!row) continue;
        const raw = String(effectiveValue(it)).trim();
        const bad = Number.isNaN(parseNumber(raw));
        const changed = run && it.id in state.run.overrides;
        const vv = row.querySelector('.vv');
        if (vv) vv.innerHTML = `${esc(raw ? displayOf(it, raw) : '–')}${changed ? `<span class="was">was ${esc(displayOf(it, it.value))}</span>` : ''}`;
        row.classList.toggle('changed', changed);
        row.classList.toggle('bad', bad || calc.dupes.has(it.id));
        row.querySelector('.vval')?.classList.toggle('bad', bad);
        row.querySelector('.vname')?.classList.toggle('bad', calc.dupes.has(it.id));
      }
    },
    onInput(b, e) {
      const it = b.items.find(i => i.id === e.target.closest('[data-item]')?.dataset.item);
      if (!it) return;
      if (e.target.matches('.vname')) it.name = e.target.value;
      if (e.target.matches('.vval')) {
        if (!isRun()) it.value = e.target.value;
        else if (e.target.value === it.value) delete state.run.overrides[it.id];
        else state.run.overrides[it.id] = e.target.value;
      }
      save();
      refresh();
    },
    onChange(b, e) {
      if (!e.target.matches('.vunit')) return;
      b.items.find(i => i.id === e.target.closest('[data-item]').dataset.item).unit = e.target.value;
      renderBlock(b);
      save();
      refresh();
    },
    onClick(b, e) {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act || (act === 'open' && isPicking())) return;
      const id = e.target.closest('[data-item]')?.dataset.item;
      if (act === 'open') openRows.set(b.id, id);
      else if (act === 'close') openRows.delete(b.id);
      else if (act === 'add') { const it = { id: uid(), name: '', value: '', unit: '' }; b.items.push(it); openRows.set(b.id, it.id); }
      else if (act === 'del') { b.items = b.items.filter(i => i.id !== id); delete state.run.overrides[id]; openRows.delete(b.id); }
      else if (act === 'undo') delete state.run.overrides[id];
      else return;
      renderBlock(b);
      bodyOf(b).querySelector(act === 'add' ? '.vedit .vname' : '.vedit .vval')?.focus();
      save();
      refresh();
    },
  },

  formula: {
    label: 'Formula', glyph: 'ƒ', hint: 'Math over your values, shown with its working', size: [4, 6],
    make: () => ({ items: [] }),
    render(b, body) {
      const run = isRun();
      const open = openRows.get(b.id);
      body.innerHTML = `<div class="flist">${b.items.map(it => {
        if (it.id !== open) return `<div class="frow" data-item="${it.id}" data-act="open" data-pick="${esc(it.name)}"><div class="fhead"><span class="fname-ro">${esc(it.name) || '<span class="hint">Unnamed</span>'}</span><span class="fres" data-res></span></div><div class="fwork" data-work></div></div>`;

        return `<div class="fedit" data-item="${it.id}"><div class="fl1"><input class="in fname" value="${esc(it.name)}" placeholder="Name" spellcheck="false" /><select class="in funit" title="Show the answer in">${FORMULA_UNITS.map(u => `<option value="${esc(u)}"${u === it.unit ? ' selected' : ''}>${esc(u === '' ? 'number' : u === 'x' ? 'fold ×' : u)}</option>`).join('')}</select></div><div class="fl2"><span class="eq">=</span><input class="in fexpr mono" value="${esc(it.expr)}" placeholder="click names, or type" spellcheck="false" /></div><div class="fl3">${trayToggleHtml(true)}</div><div class="fwork" data-work></div>${tools}</div>`;

      else if (act === 'close') openRows.delete(b.id);

      else if (act === 'del') { b.items = b.items.filter(i => i.id !== id); openRows.delete(b.id); }

  plate: {
    label: 'Vessel map', glyph: '⠿', hint: 'Plates, flasks, dishes or tubes; counts feed formulas', size: [5, 8],
    make: () => ({ vessel: '96', count: 1, active: 0, wells: {} }),
    render(b, body) {
      const sheet = vesselSheet(b);
      const sel = vesselSel(b).set;
      let cells = '';
      if (sheet.plate) {
        cells += '<div class="corner" title="Select all"></div>';
        for (let c = 0; c < sheet.cols; c++) cells += `<div class="ch" data-col="${c}">${c + 1}</div>`;
      }
      for (let r = 0; r < sheet.rows; r++) {
        if (sheet.plate) cells += `<div class="rh" data-row="${r}">${ROW_LETTERS[r]}</div>`;
        for (let c = 0; c < sheet.cols; c++) {
          const key = sheet.keyAt(r, c);
          if (!key) continue;
          const g = b.wells[key];
          const label = sheet.labelAt(r, c);
          const inner = sheet.plate ? (g ? GROUPS[g].short : '') : `<b>${label}</b><span>${g ? GROUPS[g].label : ''}</span>`;
          cells += `<div class="${sheet.plate ? 'well' : 'vessel'}${g ? ` g-${g}` : ''}${sel.has(key) ? ' sel' : ''}" data-key="${key}" data-r="${r}" data-c="${c}" title="${label}${g ? ` · ${GROUPS[g].label}` : ''}">${inner}</div>`;
        }
      }
      const byGroup = Object.entries(VESSELS).reduce((acc, [key, vessel]) => { (acc[vessel.group] ??= []).push([key, vessel]); return acc; }, {});
      const options = Object.entries(byGroup).map(([group, list]) => `<optgroup label="${group}">${list.map(([key, vessel]) => `<option value="${key}"${key === b.vessel ? ' selected' : ''}>${vessel.label}</option>`).join('')}</optgroup>`).join('');
      const tabs = sheet.plate && b.count > 1 ? `<div class="vtabs">${Array.from({ length: b.count }, (_, i) => `<button class="vtab${i === b.active ? ' on' : ''}" data-plate="${i}">Plate ${i + 1}</button>`).join('')}</div>` : '';
      const columns = `${sheet.plate ? '16px ' : ''}repeat(${sheet.cols}, var(--ws))`;
      const rows = `${sheet.plate ? '14px ' : ''}repeat(${sheet.rows}, var(--ws))`;
      body.innerHTML = `<div class="ptools"><select class="in vkind">${options}</select><span class="times">×</span><input class="in vcount mono" type="number" min="1" max="48" value="${b.count}" title="How many" /></div><div class="ptools">${Object.entries(GROUPS).map(([k, g]) => `<button class="pal" data-group="${k}"><i class="g-${k}"></i>${g.label}</button>`).join('')}<button class="pal" data-group="">Set as empty</button></div>${tabs}<div class="${sheet.plate ? 'plate' : 'vessels'}" style="grid-template-columns: ${columns}; grid-template-rows: ${rows}">${cells}</div><div class="pcounts"></div>`;
    },
    fit(b, body) {
      const sheet = vesselSheet(b);
      const grid = body.querySelector('.plate, .vessels');
      if (!grid) return;
      const above = [...body.querySelectorAll('.ptools, .vtabs')].reduce((h, el) => h + el.offsetHeight + 8, 0);
      const headers = sheet.plate ? 18 : 0;
      const byWidth = (body.clientWidth - 24 - headers) / sheet.cols - 4;
      const byHeight = (body.clientHeight - 20 - above - 34 - headers) / sheet.rows - 4;
